<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LEXVORTEX — Secretária Digital Jurídica</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14213D">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --paper:#F1F3F7;--surface:#FFFFFF;--surface2:#F7F8FB;--text:#18203A;--muted:#5B6478;--line:#DCE1EA;
  --navy:#14213D;--navy2:#1E2F55;--on-navy:#FFFFFF;--on-navy-muted:#A9B4CC;
  --accent:#C95C0C;--accent-soft:#FBEADB;--on-accent:#FFFFFF;
  --crit:#C62828;--crit-soft:#FBE4E4;--warn:#B85F00;--warn-soft:#FDEFD9;--att:#8A6D00;--att-soft:#FAF3D2;
  --ok:#1D7A63;--ok-soft:#DDF1EA;--cnt:#E3E9F4;--closed:#ECEEF2;
  --shadow:0 1px 2px rgba(20,33,61,.06);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D1424;--surface:#152036;--surface2:#1A2640;--text:#E7EBF4;--muted:#9AA6BE;--line:#27344F;
  --navy:#0A1020;--navy2:#18264A;--on-navy:#FFFFFF;--on-navy-muted:#8F9BB5;
  --accent:#E47A2A;--accent-soft:#3A2614;--on-accent:#1A0E04;
  --crit:#F0625F;--crit-soft:#3B1A1D;--warn:#F0A04B;--warn-soft:#3A2A14;--att:#E2C24F;--att-soft:#352F15;
  --ok:#4CC3A2;--ok-soft:#143229;--cnt:#22335A;--closed:#1C2538;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0D1424;--surface:#152036;--surface2:#1A2640;--text:#E7EBF4;--muted:#9AA6BE;--line:#27344F;
  --navy:#0A1020;--navy2:#18264A;--on-navy:#FFFFFF;--on-navy-muted:#8F9BB5;
  --accent:#E47A2A;--accent-soft:#3A2614;--on-accent:#1A0E04;
  --crit:#F0625F;--crit-soft:#3B1A1D;--warn:#F0A04B;--warn-soft:#3A2A14;--att:#E2C24F;--att-soft:#352F15;
  --ok:#4CC3A2;--ok-soft:#143229;--cnt:#22335A;--closed:#1C2538;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--text);font:15px/1.5 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
.serif{font-family:'IBM Plex Serif',Georgia,'Times New Roman',serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;line-height:1.2}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Login */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:var(--navy);color:var(--on-navy);padding:24px}
.login-box{width:100%;max-width:340px;text-align:center}
.brand{font-weight:700;letter-spacing:.14em;font-size:22px}
.brand span{color:var(--accent)}
.login p.slogan{color:var(--on-navy-muted);margin:8px 0 36px;font-size:14px}
.pin-dots{display:flex;justify-content:center;gap:16px;margin:8px 0 10px}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--on-navy-muted)}
.pin-dots i.on{background:var(--accent);border-color:var(--accent)}
.pin-msg{min-height:22px;font-size:13px;color:var(--on-navy-muted)}
.pin-msg.err{color:#FF9C8F}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.pad button{height:64px;border-radius:16px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:var(--on-navy);font-size:24px;font-weight:500}
.pad button:active{background:rgba(255,255,255,.16)}
.pad .ghost{background:none;border:none;font-size:14px;color:var(--on-navy-muted)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.who{margin-bottom:24px;font-size:14px;color:var(--on-navy-muted)}
.who b{display:block;color:var(--on-navy);font-size:17px;font-weight:600}

/* Shell */
.shell{display:flex;min-height:100vh;min-height:100dvh}
.side{display:none}
.main{flex:1;min-width:0;padding-bottom:96px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
.top .brand{font-size:16px;color:var(--text)}
.top-right{display:flex;gap:8px;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--navy2);color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px;border:none}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.view{max-width:1120px;margin:0 auto;padding:20px 18px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;min-height:56px;font-size:11px;color:var(--muted);border-radius:10px}
.nav button.on{color:var(--accent);font-weight:600}
.nav svg{width:24px;height:24px}
@media (min-width:900px){
  .side{display:flex;flex-direction:column;width:236px;flex:0 0 236px;background:var(--navy);color:var(--on-navy);padding:28px 16px;position:sticky;top:0;height:100vh}
  .side .brand{color:var(--on-navy);font-size:18px;padding:0 10px}
  .side .slogan{color:var(--on-navy-muted);font-size:12px;padding:4px 10px 28px;line-height:1.4}
  .side button{display:flex;align-items:center;gap:12px;border:none;background:none;color:var(--on-navy-muted);padding:12px;border-radius:10px;font-size:15px;text-align:left;min-height:48px}
  .side button svg{width:20px;height:20px}
  .side button.on{background:var(--navy2);color:var(--on-navy);font-weight:600}
  .side button.on svg{color:var(--accent)}
  .side .foot{margin-top:auto;font-size:12px;color:var(--on-navy-muted);padding:10px}
  .nav,.top .brand{display:none}
  .top{justify-content:flex-end}
  .main{padding-bottom:40px}
  .view{padding:28px 32px}
}

/* Common */
.h-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.h-row h1{font-size:26px;font-weight:600}
.h-row p{margin:4px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.pad-card{padding:18px}
.sec-t{font-size:16px;font-weight:600;margin:0 0 12px}
.grid2{display:grid;gap:18px}
@media (min-width:900px){.grid2{grid-template-columns:1.25fr 1fr}}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.dark{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.l-crit{color:var(--crit);background:var(--crit-soft)}
.l-urg{color:var(--warn);background:var(--warn-soft)}
.l-att{color:var(--att);background:var(--att-soft)}
.l-norm{color:var(--muted);background:var(--surface2)}
.l-ok{color:var(--ok);background:var(--ok-soft)}
.pos{color:var(--ok);font-weight:600}.neg{color:var(--crit);font-weight:600}
.muted{color:var(--muted)}
.back{border:none;background:none;color:var(--muted);padding:8px 0;margin-bottom:6px;font-weight:500;min-height:44px}

/* Alert banner */
.alert{display:grid;grid-template-columns:1fr auto;gap:14px 18px;align-items:center;background:var(--crit);color:#fff;border-radius:16px;padding:18px 20px;margin-bottom:18px}
.alert .k{font-size:13px;opacity:.9;margin:0}
.alert h2{font-size:21px;font-weight:600;margin:2px 0}
.alert .meta{margin:0;font-size:14px;opacity:.92}
.alert .when{text-align:center;line-height:1}
.alert .when b{display:block;font-size:52px;font-weight:600}
.alert .when span{font-size:13px}
.alert .acts{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
.alert .acts .btn{background:#fff;color:#8E1515;border-color:#fff}
.alert .acts .btn.o{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
:root[data-theme="dark"] .alert, .alert{}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .alert{background:#7A1C1F}}
:root[data-theme="dark"] .alert{background:#7A1C1F}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}
@media (min-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{padding:16px;border:1px solid var(--line);background:var(--surface);border-radius:14px;text-align:left;min-height:112px;display:flex;flex-direction:column;justify-content:space-between}
.kpi b{font-size:30px;font-weight:600;line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.hot b{color:var(--crit)}

/* Deadline rows */
.dl{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:none;background:none;padding:12px 4px;border-bottom:1px solid var(--line);min-height:64px}
.dl:last-child{border-bottom:none}
.dl .d{width:56px;flex:0 0 56px;text-align:center;line-height:1.05}
.dl .d b{display:block;font-size:22px;font-weight:600}
.dl .d small{font-size:11.5px;color:var(--muted)}
.dl .t{flex:1;min-width:0}
.dl .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl .t small{color:var(--muted);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev{display:flex;gap:14px;padding:12px 4px;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:none}
.ev .tm{width:56px;flex:0 0 56px;font-weight:600;text-align:center}
.ev .bar{width:4px;border-radius:4px;flex:0 0 4px}
.ev .tt b{display:block;font-weight:600}
.ev .tt small{color:var(--muted);font-size:13px}

/* Tables */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.seg{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 16px;min-height:44px;font-weight:500}
.seg.on{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.search{flex:1;min-width:200px;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 18px}
.tscroll{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:var(--accent);color:var(--on-accent);text-align:left;font-weight:600;padding:12px 14px;white-space:nowrap}
.tbl td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:nth-child(even) td{background:var(--surface2)}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--accent-soft)}
.tbl .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:700;border-top:2px solid var(--line)}
.mono{font-variant-numeric:tabular-nums;white-space:nowrap}

/* Forms */
.form{display:grid;gap:14px}
.f label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 14px}
.f textarea{min-height:90px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:12px;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--surface);font-weight:500}
.check input{width:22px;height:22px;accent-color:var(--accent)}

/* Calculator result */
.termo{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin:4px 0 14px}
.termo .big{font-size:52px;font-weight:600;line-height:1;color:var(--text)}
.termo .wd{color:var(--muted);font-size:15px;margin-top:6px}
.termo .left{padding-bottom:6px}
.strip-wrap{overflow-x:auto;padding:4px 0 10px;margin:0 -4px}
.strip{display:flex;gap:3px;padding:0 4px;min-width:max-content}
.cell{width:30px;flex:0 0 30px;text-align:center;border-radius:7px;padding:5px 0 4px;font-size:12px;line-height:1.15;background:var(--cnt);color:var(--text)}
.cell small{display:block;font-size:9.5px;color:var(--muted)}
.cell.ev{background:none;border:2px solid var(--navy2);padding:3px 0 2px}
.cell.cl{background:var(--closed);color:var(--muted)}
.cell.susp{background:repeating-linear-gradient(135deg,var(--accent-soft) 0 5px,transparent 5px 9px);border:1px solid var(--accent);color:var(--accent)}
.cell.tm{background:var(--crit);color:#fff}
.cell.tm small{color:#fff}
.cell.gr{background:var(--warn-soft);border:1px solid var(--warn);color:var(--warn)}
.mlab{font-size:11px;color:var(--muted);height:16px;white-space:nowrap}
.col{display:flex;flex-direction:column}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin-bottom:14px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.steps{margin:0;padding-left:20px;display:grid;gap:8px;font-size:14px}
.steps li::marker{color:var(--accent);font-weight:700}
.note{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:10px 12px;margin-top:14px}

/* Minutas */
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px}
.paper{background:#FFFFFF;color:#1B1B1B;border-radius:6px;padding:36px 34px;border:1px solid var(--line);font-family:'IBM Plex Serif',Georgia,serif;font-size:15px;line-height:1.75;white-space:pre-wrap;min-height:480px}
.paper .tt{text-align:center;font-weight:600;letter-spacing:.06em;margin-bottom:18px}
.paper mark{background:#FDEBD3;color:#7A3A06;border-radius:3px;padding:0 3px}
.tool{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

/* Fees */
.calc-out{display:grid;gap:0;margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.calc-out div{display:flex;justify-content:space-between;padding:12px 14px;border-top:1px solid var(--line)}
.calc-out div:first-child{border-top:none}
.calc-out div.tot{background:var(--accent-soft);font-weight:700;font-size:17px}

/* Case detail */
.info{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 18px;font-size:14px}
@media (min-width:900px){.info{grid-template-columns:repeat(4,1fr)}}
.info span{display:block;color:var(--muted);font-size:12.5px}
.info b{font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy2);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90vw}
@media (min-width:900px){.toast{bottom:32px}}
.live-top{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--crit);border-radius:14px;padding:14px 16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);z-index:5}
.spk-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.spk-chips .seg{min-height:52px;white-space:nowrap}
.live-big{margin-top:14px;padding-bottom:40px}
.live-big .trow{font-size:19px;line-height:1.6}
.live-big .ts{flex-basis:76px;font-size:13px;padding-top:4px}
.recbox{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.trow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.trow input{width:20px;height:20px;margin-top:1px;accent-color:var(--accent);flex:0 0 20px}
.trow .ts{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600;flex:0 0 64px}
.trow .spk{font-weight:600}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.onb{max-width:440px;text-align:left}
.onb h2{color:var(--on-navy)}
.onb .f label{color:var(--on-navy-muted)}
.ghost-link{background:none;border:none;color:var(--on-navy-muted);margin-top:22px;min-height:44px;font-size:14px;text-decoration:underline}
.row-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.subform{border-left:3px solid var(--accent);padding-left:14px}
.start{text-align:center;padding:36px 20px}
.start .btn{margin-top:8px}
.danger{color:var(--crit)}
.danger-on{background:var(--crit);color:#fff;border-color:var(--crit)}
.lvl{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px;max-width:320px}
.lvl i{display:block;height:100%;width:0;background:var(--ok);transition:width .12s}
.tips{margin:0;padding-left:20px;color:var(--muted);font-size:14px;display:grid;gap:6px}
.spk-btn{border:none;background:none;padding:0;font-weight:600;color:var(--text);cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.seg-text{outline:none;border-radius:4px}
.seg-text:focus{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft)}
.seg-body{flex:1;min-width:0}
.cal-links{display:flex;gap:16px;flex-wrap:wrap;padding:0 4px 10px 78px;font-size:13px;border-bottom:1px solid var(--line)}
.cal-links a,.cal-links button{color:var(--accent);background:none;border:none;padding:6px 0;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;min-height:36px}
.ev{border-bottom:none}
.exp-pick{display:grid;gap:8px}
.exp-pick .check{gap:10px}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(280px,1fr);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;margin-bottom:12px}
.kcol{scroll-snap-align:start;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:180px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.tcard a{color:var(--accent)}
.warnbox{border:1px solid var(--warn);background:var(--warn-soft);border-radius:14px;padding:14px 16px;margin-bottom:16px;color:var(--text)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;min-height:120px;padding:16px;border:1px solid var(--line);background:var(--surface);border-radius:14px}
.tile b{font-size:16px}.tile span{font-size:13px;color:var(--muted)}
.nav{grid-template-columns:repeat(7,1fr)}
.nav button{font-size:10.5px}
td a,.ev a{color:var(--accent)}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
select.evst{min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px;font-size:14px}
select.evst.ok{border-color:var(--ok);color:var(--ok);font-weight:600}
.cell.uf{background:var(--cnt);border:1px dashed var(--accent)}
.infobox{border:1px solid var(--line);border-left:4px solid var(--navy2);background:var(--surface);border-radius:14px;padding:14px 16px;margin-bottom:16px}

.pin-input:focus{outline:none;border-color:#E47A2A;background:rgba(255,255,255,.12)}
.pin-input::placeholder{color:rgba(255,255,255,.28);letter-spacing:.55em}
.pin-small{font-size:22px;letter-spacing:.35em}
.lawres{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:8px;min-height:56px;color:var(--text)}
.semgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sem{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border-radius:14px;padding:14px;min-height:104px;border:2px solid transparent;color:var(--text)}
.sem b{font-size:32px;line-height:1.1}.sem span{font-weight:600;font-size:14px}.sem small{font-size:12px;color:var(--muted)}
.sem-r{background:var(--crit-soft)}.sem-r b{color:var(--crit)}.sem-y{background:var(--att-soft)}.sem-y b{color:var(--att)}.sem-g{background:var(--ok-soft)}.sem-g b{color:var(--ok)}
.sem.on{border-color:currentColor}.sem-r.on{border-color:var(--crit)}.sem-y.on{border-color:var(--att)}.sem-g.on{border-color:var(--ok)}
@media (max-width:420px){.sem{padding:10px;min-height:96px}.sem b{font-size:26px}.sem span{font-size:13px}}

<body>
<div id="root"></div>
<script>
/* ---------- Datas e calendário judicial ---------- */
const M=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const ML=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const WD=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const WDS=['D','S','T','Q','Q','S','S'];
const D=(y,m,d)=>new Date(y,m,d,12);
const TODAY=(()=>{const n=new Date();return D(n.getFullYear(),n.getMonth(),n.getDate())})();
const add=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r};
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const [y,m,d]=String(s).split('-').map(Number);return D(y,m-1,d)};
const diff=(a,b)=>Math.round((b-a)/864e5);
const fd=d=>d.getDate()+' '+M[d.getMonth()]+' '+d.getFullYear();
const fds=d=>d.getDate()+' '+M[d.getMonth()];
const fdl=d=>WD[d.getDay()]+', '+d.getDate()+' de '+ML[d.getMonth()];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return D(y,mo-1,da)}
const HC={};
function natHol(y){if(HC[y])return HC[y];const e=easter(y),h={};
 [[0,1,'Ano Novo'],[3,25,'Dia da Liberdade'],[4,1,'Dia do Trabalhador'],[5,10,'Dia de Portugal'],[7,15,'Assunção de Nossa Senhora'],[9,5,'Implantação da República'],[10,1,'Todos os Santos'],[11,1,'Restauração da Independência'],[11,8,'Imaculada Conceição'],[11,25,'Natal']].forEach(([m,d,n])=>h[key(D(y,m,d))]=n);
 h[key(add(e,-2))]='Sexta-feira Santa';h[key(e)]='Páscoa';h[key(add(e,60))]='Corpo de Deus';return HC[y]=h}
const MUNIS={lisboa:['Lisboa',[5,13]],porto:['Porto',[5,24]],braga:['Braga',[5,24]],guimaraes:['Guimarães',[5,24]],coimbra:['Coimbra',[6,4]],aveiro:['Aveiro',[4,12]],viseu:['Viseu',[8,21]],leiria:['Leiria',[4,22]],caldas:['Caldas da Rainha',[4,15]],santarem:['Santarém',[2,19]],sintra:['Sintra',[5,29]],cascais:['Cascais',[5,13]],almada:['Almada',[5,24]],setubal:['Setúbal',[8,15]],evora:['Évora',[5,29]],faro:['Faro',[8,7]],funchal:['Funchal',[7,21]],outro:['Outro município',null]};
const courtOf=k=>{const m=MUNIS[k]||MUNIS.outro;return {city:m[0],mh:m[1]}};
function holName(d,c){const n=natHol(d.getFullYear())[key(d)];if(n)return n;const cl=(typeof DB!=='undefined'&&DB.closures||[]).find(x=>x.date===key(d)&&(!x.muni||(c&&c.city===(MUNIS[x.muni]||[])[0])));if(cl)return cl.label||'Tribunais encerrados';if(c&&c.mh&&d.getMonth()===c.mh[0]&&d.getDate()===c.mh[1])return 'Feriado municipal de '+c.city;return null}
const weekend=d=>d.getDay()===0||d.getDay()===6;
const closed=(d,c)=>weekend(d)||!!holName(d,c);
function judHol(d){const m=d.getMonth(),dd=d.getDate();if((m===11&&dd>=22)||(m===0&&dd<=3))return 'Natal';if((m===6&&dd>=16)||m===7)return 'verão';const e=easter(d.getFullYear()),t=d.getTime();if(t>=add(e,-7).getTime()&&t<=add(e,1).getTime())return 'Páscoa';return null}
function closedWhy(d,c){if(d.getDay()===6)return 'sábado';if(d.getDay()===0)return 'domingo';return holName(d,c)}
const URG=[['cautelar','Procedimento cautelar','art. 363.º, n.º 1 CPC'],['insolvencia','Processo de insolvência ou PER','art. 9.º, n.º 1 CIRE'],['tutelar','Processo tutelar cível (demora prejudicial à criança)','art. 13.º RGPTC'],['promocao','Processo de promoção e proteção','art. 102.º, n.º 1 LPCJP'],['penal_preso','Processo penal com arguido detido ou preso','arts. 103.º, n.º 2, al. a) e 104.º, n.º 2 CPP'],['despedimento','Impugnação judicial do despedimento','art. 26.º, n.º 1 CPT'],['administrativo','Processo urgente administrativo','art. 36.º CPTA'],['outro','Outro processo urgente por lei','']];
const urgName=k=>(URG.find(x=>x[0]===k)||URG[7])[1];
const urgBasis=k=>(URG.find(x=>x[0]===k)||URG[7])[2];
function feriasInfo(){const cur=judHol(TODAY);let txt='';
 if(cur){let e=TODAY;while(judHol(add(e,1)))e=add(e,1);const n=DB.cases.filter(c=>c.status!=='archived'&&c.urgentLegal).length;
  txt=`<section class="infobox"><b>Férias judiciais (${cur}) até ${fd(e)}</b><br><span style="font-size:13.5px">Os prazos processuais estão suspensos, exceto nos processos urgentes e nos prazos de 6 meses ou mais (art. 138.º, n.º 1 CPC). ${n?n+' processo(s) urgente(s) continuam a contar.':''}</span></section>`}
 else{let s0=null;for(let i=1;i<=10;i++){if(judHol(add(TODAY,i))){s0=add(TODAY,i);break}}
  if(s0)txt=`<section class="infobox"><b>As férias judiciais (${judHol(s0)}) começam a ${fd(s0)}</b><br><span style="font-size:13.5px">A partir daí só correm os prazos dos processos urgentes (art. 28.º LOSJ e art. 138.º, n.º 1 CPC).</span></section>`}
 return txt}
const TPL={
 contest:{name:'Contestação',days:30,regime:'cpc',basis:'art. 569.º CPC',trigger:'citation'},
 apel:{name:'Recurso de apelação',days:30,regime:'cpc',basis:'art. 638.º CPC',trigger:'electronic'},
 sup:{name:'Prazo supletivo (requerimentos e respostas)',days:10,regime:'cpc',basis:'art. 149.º CPC',trigger:'electronic'},
 emb:{name:'Oposição à execução por embargos',days:20,regime:'cpc',basis:'art. 728.º CPC',trigger:'citation'},
 rlab:{name:'Recurso em processo do trabalho',days:20,regime:'cpt',basis:'art. 80.º CPT',trigger:'electronic'},
 desp:{name:'Impugnação do despedimento',days:60,regime:'substantive',basis:'art. 387.º, n.º 2 CT',trigger:'direct'},
 grav:{name:'Arguição de deficiência da gravação',days:10,regime:'cpc',basis:'art. 155.º, n.º 4 CPC',trigger:'direct'},
 custom:{name:'Prazo livre',days:15,regime:'cpc',basis:'—',trigger:'electronic'}};
const TRIG={electronic:'Notificação eletrónica (Citius)',postal:'Carta registada',citation:'Citação',direct:'Data do evento'};
function compute(p){
 const INC=(p.incidents||[]).filter(i=>i&&i.type);const PRE=[],POST=[];let PEND=null;
 const intr=INC.filter(i=>i.type==='interruption').sort((a,b)=>String(a.from).localeCompare(String(b.from))).pop();
 if(intr){PRE.push('Prazo interrompido a '+fd(parse(intr.from))+(intr.note?' ('+intr.note+')':'')+' — '+(intr.basis||'art. 24.º, n.º 4 da Lei n.º 34/2004')+'.');
  if(intr.to){p={...p,trigger:parse(intr.to),triggerType:'electronic'};PRE.push('O prazo recomeça por inteiro a partir da notificação de '+fd(parse(intr.to))+'.')}
  else{p={...p,trigger:TODAY,triggerType:'direct'};PEND='Aguarda a notificação que reinicia o prazo';PRE.push('Ainda sem notificação: o termo indicado é provisório, contado como se a notificação fosse hoje.')}}
 const EXT=INC.filter(i=>i.type==='extension').reduce((s,i)=>s+(+i.days||0),0);
 const SUSP=INC.filter(i=>i.type==='suspension');let SUSN=0;
 const inSus=x=>{const k=key(x);return SUSP.find(i=>k>=i.from&&k<=(i.to||key(TODAY)))};
 const c=courtOf(p.court);const steps=[];const cells=[];let start=p.trigger;
 if(p.triggerType==='electronic'||p.triggerType==='postal'){
  let pr=add(p.trigger,3);
  steps.push((p.triggerType==='electronic'?'Notificação elaborada':'Carta registada')+' a '+fd(p.trigger)+'; presume-se feita no 3.º dia posterior, '+fd(pr)+' ('+(p.triggerType==='electronic'?'art. 248.º':'art. 249.º')+' CPC).');
  if(closed(pr,c)){const w=closedWhy(pr,c);while(closed(pr,c))pr=add(pr,1);steps.push('Esse dia não é útil ('+w+'): a notificação considera-se feita a '+fd(pr)+'.')}
  start=pr;
 }else if(p.triggerType==='citation')steps.push('Citação a '+fd(p.trigger)+'.');
 else steps.push('Evento a '+fd(p.trigger)+'.');
 const suspend=p.regime!=='substantive'&&!p.urgent&&p.days<180;
 const total=p.days+(p.dil||0)+EXT;
 if(p.dil)steps.push('Dilação de '+p.dil+' dias somada ao prazo de '+p.days+' dias: '+total+' dias (art. 245.º CPC).');
 cells.push({d:start,t:'ev'});
 let d=start,n=0,sus=0,UHD=0;
 while(n<total){d=add(d,1);const sp=inSus(d);if(sp){if(!sp.to)PEND=PEND||'Suspensão em curso';cells.push({d,t:'susp'});SUSN++;continue}if(suspend&&judHol(d)){cells.push({d,t:'susp'});sus++;continue}n++;const fj=p.regime!=='substantive'&&!suspend&&!!judHol(d);if(fj)UHD++;cells.push({d,t:closed(d,c)?'cl':fj?'uf':'cnt',n})}
 if(p.regime==='substantive')steps.push('Prazo substantivo de '+total+' dias, contado a partir do dia seguinte (art. 279.º, al. b) CC); não se suspende em férias judiciais.');
 else steps.push('Prazo contínuo de '+total+' dias, a contar do dia seguinte, '+fd(add(start,1))+' (art. 138.º, n.º 1 CPC e art. 279.º, al. b) CC).');
 if(sus)steps.push(sus+' dias não contados por coincidirem com férias judiciais (art. 138.º, n.º 1 CPC; art. 28.º LOSJ).');
 if(p.regime!=='substantive'&&!suspend){steps.push(p.urgent?'Processo urgente'+(p.urgentType?' — '+p.urgentType:'')+': o prazo corre durante as férias judiciais (art. 138.º, n.º 1 CPC'+(p.urgentBasis?'; '+p.urgentBasis:'')+').':'Prazo igual ou superior a 6 meses: não se suspende durante as férias judiciais (art. 138.º, n.º 1 CPC).');if(UHD)steps.push(UHD+' dia(s) de férias judiciais contado(s) normalmente.')}
 let t=d;
 const blocked=x=>p.regime==='substantive'?(x.getDay()===0||!!holName(x,c)):closed(x,c);
 if(blocked(t)){const w=closedWhy(t,c);const first=t;cells[cells.length-1].t='cl';while(blocked(t)){t=add(t,1);if(blocked(t))cells.push({d:t,t:'cl'})}cells.push({d:t,t:'tm'});steps.push('Terminaria a '+fd(first)+' ('+w+'); transfere-se para o 1.º dia útil seguinte, '+fd(t)+' ('+(p.regime==='substantive'?'art. 279.º, al. e) CC':'art. 138.º, n.º 2 CPC')+').')}
 else cells[cells.length-1].t='tm';
 INC.filter(i=>i.type==='extension').forEach(i=>POST.push('Prorrogação de '+i.days+' dias'+(i.note?' ('+i.note+')':'')+' — '+(i.basis||'art. 569.º, n.º 4 CPC')+'.'));
 SUSP.forEach(i=>POST.push((i.to?'Prazo suspenso de '+fd(parse(i.from))+' a '+fd(parse(i.to)):'Prazo suspenso desde '+fd(parse(i.from))+', ainda em curso: termo provisório')+(i.note?' ('+i.note+')':'')+' — '+(i.basis||'art. 275.º CPC')+'.'));
 if(SUSN)POST.push(SUSN+' dia(s) não contado(s) por suspensão.');
 const OV=INC.filter(i=>i.type==='override').pop();if(OV){t=parse(OV.date);POST.push('Termo fixado em '+fd(t)+(OV.note?' ('+OV.note+')':'')+' — '+(OV.basis||'despacho judicial')+'.')}
 let g=null;
 if(p.regime!=='substantive'){g=t;let k=0;while(k<3){g=add(g,1);if(closed(g,c)||(suspend&&judHol(g))){cells.push({d:g,t:'cl'});continue}k++;cells.push({d:g,t:'gr',n:k})}
  steps.push('O ato ainda pode ser praticado até '+fd(g)+', com multa de 10%, 25% ou 40% da taxa de justiça, conforme o dia (art. 139.º, n.º 5 CPC).')}
 return {start,termo:t,grace:g,steps:[...PRE,...steps,...POST],cells,sus,pending:!!PEND,pendWhy:PEND};
}
const graceLeft=r=>r.cells.filter(c=>c.t==='gr'&&diff(TODAY,c.d)>=0).length;

/* ---------- Armazenamento local ---------- */
const DB_KEY='lexvortex-v2';
const fresh=()=>({profile:null,clients:[],cases:[],deadlines:[],events:[],fees:[],recs:[],docs:[],time:[],templates:[],timer:null,expenses:[],feeSeq:{},contacts:[],tasks:[],team:[],inbox:[],ducs:[],limitations:[],evidence:[],obligations:[],mandates:[],jurosTab:null,closures:[],lastBackup:null,notes:[],audit:[],seq:1});
let DB=fresh();
function load(){try{const s=localStorage.getItem(DB_KEY);if(s)DB=Object.assign(fresh(),JSON.parse(s))}catch(_){}}
function save(){try{localStorage.setItem(DB_KEY,JSON.stringify(DB))}catch(_){toast('Não foi possível guardar neste dispositivo.')}if(typeof scheduleAlerts==='function')scheduleAlerts()}
const nid=p=>p+(DB.seq++)+Date.now().toString(36).slice(-5);
let idb=null;
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('lexvortex-audio',1);r.onupgradeneeded=()=>r.result.createObjectStore('a');r.onsuccess=()=>{idb=r.result;res(idb)};r.onerror=()=>res(null)}catch(_){res(null)}})}
function audioPut(id,blob){if(!idb)return;try{idb.transaction('a','readwrite').objectStore('a').put(blob,id)}catch(_){}}
function audioGet(id){return new Promise(res=>{if(!idb)return res(null);try{const q=idb.transaction('a').objectStore('a').get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(_){res(null)}})}
function audioDel(id){if(!idb)return;try{idb.transaction('a','readwrite').objectStore('a').delete(id)}catch(_){}}
const AURL={};
async function audioUrl(id){if(AURL[id])return AURL[id];const b=await audioGet(id);if(!b)return null;return AURL[id]=URL.createObjectURL(b)}
async function hashPin(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('lexvortex:'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(_){return 'p:'+p}}

/* ---------- Utilitários ---------- */
const $=id=>document.getElementById(id);
const val=id=>{const e=$(id);return e?String(e.value).trim():''};
const chk=id=>{const e=$(id);return !!(e&&e.checked)};
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const eur=n=>(+n||0).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const P=()=>DB.profile||{title:'Dr.',name:'',cedula:'',addr:''};
const fem=()=>P().title==='Dra.';
const LNAME=()=>(P().title+' '+P().name).trim();
const initials=()=>P().name.split(/\s+/).filter(Boolean).map(w=>w[0]).filter((_,i,a)=>i===0||i===a.length-1).join('').toUpperCase()||'?';
const caseById=id=>DB.cases.find(c=>c.id===id);
const clientById=id=>DB.clients.find(c=>c.id===id);
const VAT=.23,WHT=.23;
const feeCalc=(H,company,exempt)=>{H=+H||0;const vat=exempt?0:H*VAT,ret=company?H*WHT:0;return {vat,ret,due:H+vat-ret}};
const AREAS=['Cível','Laboral','Família','Penal','Administrativo','Fiscal','Outro'];
const PHASES=['Pré-judicial','Articulados','Saneamento','Instrução','Julgamento','Sentença','Recurso','Execução'];
const opts=(arr,sel)=>arr.map(([v,l])=>`<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(l)}</option>`).join('');
const caseOpts=(sel,blank)=>(blank?`<option value="">${blank}</option>`:'')+DB.cases.filter(x=>x.status!=='archived'||x.id===sel).map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.num||x.title)} · ${esc((clientById(x.clientId)||{}).name||'')}</option>`).join('');
const AI=()=>!!(window.claude&&typeof window.claude.use==='function');

/* ---------- Prazos ---------- */
function res(d){const c=caseById(d.caseId);return compute({...d,urgent:c?!!c.urgentLegal:!!d.urgent,urgentType:c&&c.urgentLegal?urgName(c.urgentType):'',urgentBasis:c&&c.urgentLegal?(c.urgentBasis||urgBasis(c.urgentType)):'',trigger:parse(d.trigger),court:c?c.court:'outro'})}
function level(d){if(d.done)return 'ok';const r=res(d),x=diff(TODAY,r.termo);if(r.pending)return 'susp';if(x<0)return (r.grace&&diff(TODAY,r.grace)>=0)?'multa':'lost';if(x<=1)return 'crit';if(x<=3)return 'urg';if(x<=7)return 'att';return 'norm'}
const LV={crit:['l-crit','Crítico'],multa:['l-crit','Em multa'],lost:['l-crit','Ultrapassado'],urg:['l-urg','Urgente'],att:['l-att','Atenção'],norm:['l-norm','Normal'],ok:['l-ok','Entregue'],susp:['l-norm','Suspenso']};
const chip=l=>`<span class="chip ${LV[l][0]}">${LV[l][1]}</span>`;
function openDl(){return DB.deadlines.filter(d=>!d.done&&caseById(d.caseId)).map(d=>({d,r:res(d),l:level(d)})).sort((a,b)=>a.r.termo-b.r.termo)}
function caseUrg(c){if(c.status==='archived')return 'archived';const ls=openDl().filter(x=>x.d.caseId===c.id).map(x=>x.l);return ls.some(l=>['crit','multa','lost','urg'].includes(l))?'critical':'normal'}
function nextDl(c){return openDl().find(x=>x.d.caseId===c.id)}

/* ---------- Estado ---------- */
const S={view:'hoje',caseId:null,filter:'todos',q:'',pin:'',
 calc:{tpl:'contest',title:'Contestação',trigger:key(TODAY),triggerType:'citation',days:30,dil:0,court:'lisboa',urgent:false,caseId:''},
 doc:{tpl:'proc',caseId:'',f:{}},fee:{H:1000,company:true,exempt:false,exp:0}};

/* ---------- Ícones ---------- */
const I={
 hoje:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
 processos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
 prazos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>',
 minutas:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>',
 agenda:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',

 audit('login_fail');

function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector('script[src="'+src+'"]')&&(src===LIB_PDF?window.jspdf:window.docx))return res();const s=document.createElement('script');s.src=src;s.onload=()=>res();s.onerror=()=>rej(new Error('load'));document.head.appendChild(s)})}
function recMeta(r){const c=caseById(r.caseId)||{},cl=clientById(c.clientId)||{};return [['Processo',c.num||'—'],['Assunto',c.title||'—'],['Tribunal',c.courtName||'—'],['Cliente',cl.name||'—'],['Parte adversa',c.adv||'—'],['Registo',(RK[r.kind]||RK.live)[1]],['Data',fd(parse(r.date))],['Duração',r.dur],['Elaborada por',LNAME()+(P().cedula?', cédula profissional n.º '+P().cedula:'')]]}

async function saveBlob(blob,name){if(NATIVE)return nativeSave(blob,name);let dl=null;try{dl=window.claude&&typeof window.claude.use==='function'?await window.claude.use('downloads'):null}catch(_){}
 if(dl){try{await dl.save({filename:name,data:blob});return true}catch(e){if(e&&e.code==='declined')return false}}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);return true}
function buildPdf(r,J){const doc=new J({unit:'mm',format:'a4'});const W=210,H=297,ML=20,MR=20,TW=W-ML-MR;let y=22;
 const need=h=>{if(y+h>H-20){doc.addPage();y=22}};
 doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text('TRANSCRIÇÃO',W/2,y,{align:'center'});y+=10;
 doc.setFontSize(10);
 for(const [k,v] of recMeta(r)){const lines=doc.splitTextToSize(String(v),TW-38);need(lines.length*5);doc.setFont('helvetica','bold');doc.text(k,ML,y);doc.setFont('helvetica','normal');doc.text(lines,ML+38,y);y+=lines.length*5}
 y+=2;doc.setDrawColor(200);doc.line(ML,y,W-MR,y);y+=6;
 doc.setFont('helvetica','italic');doc.setFontSize(9);doc.setTextColor(90);const nl=doc.splitTextToSize(EXP_NOTE,TW);doc.text(nl,ML,y);y+=nl.length*4.5+4;doc.setTextColor(0);
 for(const s of r.segs){doc.setFontSize(10.5);const lines=doc.splitTextToSize(String(s[2]),TW-6);need(6+lines.length*5.2);
  doc.setFont('helvetica','normal');doc.setTextColor(120);doc.text('['+s[0]+']',ML,y);doc.setTextColor(0);doc.setFont('helvetica','bold');doc.text(String(s[1]),ML+22,y);y+=5.4;
  doc.setFont('helvetica','normal');doc.text(lines,ML+6,y);y+=lines.length*5.2+3}
 const n=doc.getNumberOfPages(),c=caseById(r.caseId)||{};
 for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(120);doc.text('Processo '+(c.num||c.title||''),ML,H-10);doc.text('Página '+i+' de '+n,W-MR,H-10,{align:'right'});doc.setTextColor(0)}
 return doc.output('blob')}
function buildDocx(r,X){const {Document,Paragraph,TextRun,Table,TableRow,TableCell,WidthType,AlignmentType,BorderStyle,Footer,Header,PageNumber}=X;
 const thin={style:BorderStyle.SINGLE,size:4,color:'D0D5DD'};const borders={top:thin,bottom:thin,left:thin,right:thin,insideHorizontal:thin,insideVertical:thin};
 const meta=new Table({width:{size:100,type:WidthType.PERCENTAGE},borders,rows:recMeta(r).map(([k,v])=>new TableRow({children:[new TableCell({width:{size:26,type:WidthType.PERCENTAGE},children:[new Paragraph({children:[new TextRun({text:k,bold:true})]})]}),new TableCell({width:{size:74,type:WidthType.PERCENTAGE},children:[new Paragraph({children:[new TextRun(String(v))]})]})]}))});
 const body=r.segs.map(s=>new Paragraph({spacing:{after:140},children:[new TextRun({text:'['+s[0]+']  ',color:'7A7F8C'}),new TextRun({text:s[1]+': ',bold:true}),new TextRun(String(s[2]))]}));
 const c=caseById(r.caseId)||{};
 const doc=new Document({creator:LNAME(),title:'Transcrição — '+(c.num||c.title||''),styles:{default:{document:{run:{font:'Arial',size:22}}}},
  sections:[{properties:{page:{margin:{top:1134,bottom:1134,left:1134,right:1134}}},
  headers:{default:new Header({children:[new Paragraph({alignment:AlignmentType.RIGHT,children:[new TextRun({text:'Processo '+(c.num||c.title||''),size:16,color:'7A7F8C'})]})]})},
  footers:{default:new Footer({children:[new Paragraph({alignment:AlignmentType.RIGHT,children:[new TextRun({children:['Página ',PageNumber.CURRENT,' de ',PageNumber.TOTAL_PAGES],size:16,color:'7A7F8C'})]})]})},
  children:[new Paragraph({alignment:AlignmentType.CENTER,spacing:{after:240},children:[new TextRun({text:'TRANSCRIÇÃO',bold:true,size:32})]}),meta,
   new Paragraph({spacing:{before:240,after:240},children:[new TextRun({text:EXP_NOTE,italics:true,size:18,color:'5B6478'})]}),...body]}]});
 return X.Packer.toBlob(doc)}
async function exportRec(r,kind){if(!r.segs.length)return toast('Esta gravação ainda não tem texto para exportar.');S.expBusy=r.id+kind;render();

function loadLib(src,glob){return new Promise((res,rej)=>{if(window[glob])return res(window[glob]);const s=document.createElement('script');s.src=src;s.onload=()=>window[glob]?res(window[glob]):rej(new Error('load'));s.onerror=()=>rej(new Error('load'));document.head.appendChild(s)})}
const fmtSize=b=>b<1024*1024?Math.max(1,Math.round(b/1024))+' KB':(b/1048576).toFixed(1).replace('.',',')+' MB';

/* ---------- Documentos do processo ---------- */
const MNUM={janeiro:0,fevereiro:1,'março':2,marco:2,abril:3,maio:4,junho:5,julho:6,agosto:7,setembro:8,outubro:9,novembro:10,dezembro:11};
function findDates(text){const found=new Map();const push=(y,m,d)=>{if(y<100)y+=2000;const dt=D(y,m,d);if(dt.getMonth()!==m||dt.getDate()!==d)return;const k=key(dt);found.set(k,(found.get(k)||0)+1)};
 for(const x of text.matchAll(/\b(\d{1,2})[-.\/](\d{1,2})[-.\/](\d{4})\b/g))push(+x[3],+x[2]-1,+x[1]);
 for(const x of text.matchAll(/\b(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})\b/g))push(+x[1],+x[2]-1,+x[3]);
 for(const x of text.toLowerCase().matchAll(/\b(\d{1,2})\s+de\s+(janeiro|fevereiro|março|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)\s+de\s+(\d{4})\b/g))push(+x[3],MNUM[x[2]],+x[1]);
 return [...found.keys()].filter(k=>{const x=diff(parse(k),TODAY);return x>=-60&&x<=400}).sort((a,b)=>Math.abs(diff(parse(a),TODAY))-Math.abs(diff(parse(b),TODAY))).slice(0,6)}
async function scanPdf(d,file){d.scanning=true;render();
 try{const lib=await loadLib(LIB_PDFJS,'pdfjsLib');lib.GlobalWorkerOptions.workerSrc=LIB_PDFJS_W;const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  let text='';for(let i=1;i<=Math.min(pdf.numPages,5);i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();text+=tc.items.map(t=>t.str).join(' ')+'\n'}
  d.dates=findDates(text);d.hasText=text.trim().length>20}
 catch(_){d.dates=[];d.hasText=false}
 d.scanning=false;d.scanned=true;save();render()}

 audioPut('doc:'+d.id,f);AURL['doc:'+d.id]=URL.createObjectURL(f);DB.docs.push(d);save();if(d.isPdf)scanPdf(d,f)}

const ymd=s=>s.replace(/-/g,'');
function evTimes(e){if(!e.time)return null;const [h,m]=e.time.split(':').map(Number);const eh=Math.min(23,h+1),em=h===23?59:m;return {s:e.date+'T'+e.time+':00',e:e.date+'T'+String(eh).padStart(2,'0')+':'+String(em).padStart(2,'0')+':00'}}

const LIB_TESS='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
async function pdfDoc(file){const lib=await loadLib(LIB_PDFJS,'pdfjsLib');lib.GlobalWorkerOptions.workerSrc=LIB_PDFJS_W;return lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise}
async function pdfTextOf(pdf,max){let t='';for(let i=1;i<=Math.min(pdf.numPages,max);i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();t+=tc.items.map(x=>x.str).join(' ')+'\n'}return t}
async function pdfCanvases(pdf,max){const out=[];for(let i=1;i<=Math.min(pdf.numPages,max);i++){const pg=await pdf.getPage(i);const vp=pg.getViewport({scale:2});const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;out.push(cv)}return out}
async function imgCanvas(file){const bmp=await createImageBitmap(file);const sc=Math.min(1,2400/Math.max(bmp.width,bmp.height));const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);return cv}
async function ocr(canvases,prog){const T=await loadLib(LIB_TESS,'Tesseract');prog&&prog('A preparar o reconhecimento de texto…');const w=await T.createWorker('por');let t='';
 try{for(let i=0;i<canvases.length;i++){prog&&prog('A ler a página '+(i+1)+' de '+canvases.length+'…');const r=await w.recognize(canvases[i]);t+=r.data.text+'\n'}}finally{try{await w.terminate()}catch(_){}}return t}
const isPdfFile=f=>/pdf/i.test(f.type||'')||/\.pdf$/i.test(f.name||'');
const isImgFile=f=>/^image\//i.test(f.type||'')||/\.(jpe?g|png|webp|heic)$/i.test(f.name||'');
async function fileText(file,prog,forceOcr){if(isPdfFile(file)){const pdf=await pdfDoc(file);let t=forceOcr?'':await pdfTextOf(pdf,5);if(t.replace(/\s+/g,'').length<40){t=await ocr(await pdfCanvases(pdf,3),prog);return {text:t,ocr:true}}return {text:t,ocr:false}}
 if(isImgFile(file))return {text:await ocr([await imgCanvas(file)],prog),ocr:true};return {text:'',ocr:false}}

function conflicts(name,asClient,exceptCase){const n=normName(name).trim();if(n.length<4)return [];const hits=[];
 if(asClient)DB.cases.forEach(c=>{if(c.id!==exceptCase&&c.adv&&normName(c.adv).trim()===n)hits.push(name+' é parte contrária no processo '+(c.num||c.title))});

 return hits}

 const due=addYMD(parse(from),+l.y||0,+l.m||0,+l.dd||0);const cad=(LIMCAT[l.cat]||LIMCAT.outro).kind==='Caducidade';const fileBy=cad?due:add(due,-5);

 return {from,due,fileBy,left:diff(TODAY,due),leftFile:diff(TODAY,fileBy),steps}}

function parseNoticeText(text,cs0){const T=String(text||'');const flat=T.replace(/\s+/g,' ');
 const nm=flat.match(CITIUS_RE);const num=nm?nm[1]+'/'+nm[2]+'.'+nm[3]:'';const cs=cs0||(num?DB.cases.find(c=>normNum(c.num)===normNum(num)):null);
 const trib=(flat.match(/(Tribunal (?:Judicial )?da Comarca d[eoa]s? [A-ZÀ-Ú][\wÀ-ú.'-]*(?: [A-ZÀ-Ú][\wÀ-ú.'-]*){0,3})/)||[])[1]||'';
 const juizo=(flat.match(/(Ju[íi]zo (?:[A-ZÀ-Úa-zà-ú]+ ){1,5}de [A-ZÀ-Ú][\wÀ-ú'-]*(?: (?:da|de|do)? ?[A-ZÀ-Ú][\wÀ-ú'-]*){0,2}(?: - Juiz \d+)?)/)||[])[1]||'';
 const ref=(flat.match(/Refer[êe]ncia(?: Citius)?\s*:?\s*(\d{6,})/i)||[])[1]||'';
 const dm=flat.match(/prazo\s+de\s+(\d{1,3})\s*(?:\(\s*[a-zçãéíóúâê ]+\s*\)\s*)?dias/i)||flat.match(/(\d{1,3})\s*\(\s*[a-zçãéíóúâê ]+\s*\)\s*dias/i);
 const el=flat.match(/elabora[çc][ãa]o[^0-9]{0,25}(\d{1,2}[-./]\d{1,2}[-./]\d{4}|\d{4}-\d{2}-\d{2})/i);
 let date='';if(el){const d=findDates(el[1]);date=d[0]||''}
 if(!date){const ds=findDates(T).filter(k=>k<=key(TODAY)).sort().reverse();date=ds[0]||''}
 const t=nrm(flat);let act='Notificação';let triggerType='electronic';
 if(/\bcitad|\bcita[çc]ao\b/.test(t)){act='Citação';triggerType='citation'}else if(/senten[çc]a|acordao/.test(t))act='Notificação de decisão final';else if(/despacho/.test(t))act='Notificação de despacho';
 const tpl=guessAct(T,cs);
 return {num,caseId:cs?cs.id:'',court:juizo||trib,ref,act,triggerType,days:dm?+dm[1]:TPL[tpl].days,daysFound:!!dm,date:date||key(TODAY),dateFound:!!date,tpl,sample:flat.trim().slice(0,280)}}

const JUROS_DEF=[{from:'2026-01-01',to:'2026-06-30',com:9.15,tc:10.15,src:'Aviso n.º 822/2026/2'},{from:'2026-07-01',to:'2026-12-31',com:9.40,tc:10.40,src:'Aviso n.º 16623/2026/2 (a confirmar)'}];
const jurosTable=()=>(DB.jurosTab&&DB.jurosTab.length?DB.jurosTab:JUROS_DEF).slice().sort((a,b)=>a.from.localeCompare(b.from));
function calcJuros(cap,from,to,type){const out=[];let tot=0,gap=false;const a=parse(from),b=parse(to);if(!(cap>0)||b<=a)return {tot:0,rows:[],gap:false};
 if(type==='civil'||type==='compulsorio'){const r=type==='civil'?4:5;const d=diff(a,b);const v=cap*r/100*d/365;return {tot:v,rows:[{from,to,d,r,v,src:type==='civil'?'Portaria n.º 291/2003 (4%)':'art. 829.º-A, n.º 4 CC (5%)'}],gap:false}}
 let cur=a;const tab=jurosTable();
 while(cur<b){const k=key(cur);const p=tab.find(x=>k>=x.from&&k<=x.to);
  if(!p){gap=true;const nx=tab.find(x=>x.from>k);const end=nx?parse(nx.from):b;cur=end<b?end:b;continue}
  const end=add(parse(p.to),1)<b?add(parse(p.to),1):b;const d=diff(cur,end);const r=type==='tc'?p.tc:p.com;const v=cap*r/100*d/365;out.push({from:k,to:key(add(end,-1)),d,r,v,src:p.src});tot+=v;cur=end}
 return {tot,rows:out,gap}}

function buildReportPdf(c,items,from,to,showT,J,opt){opt=opt||{};const doc=new J({unit:'mm',format:'a4'});const ML=18,R=192,H=297;let y=22;const cl=clientById(c.clientId)||{};const T=(t,x,yy,o)=>doc.text(String(t),x,yy,o);

 y+=4;doc.setFillColor(240,242,246);doc.rect(ML,y-5,R-ML,8,'F');doc.setFont('helvetica','bold');T('Data',ML+1,y);T('Diligência',ML+22,y);if(showT)T('Tempo',R-1,y,{align:'right'});y+=7;doc.setFont('helvetica','normal');

 if(showT&&tot){y+=2;doc.setDrawColor(200);doc.line(ML,y-3,R,y-3);doc.setFont('helvetica','bold');T('Tempo total registado',ML+22,y+1);T(fmtMin(tot),R-1,y+1,{align:'right'});y+=8}
 doc.setFont('helvetica','italic');doc.setFontSize(8.5);doc.setTextColor(90);if(y>H-30){doc.addPage();y=22}y+=4;T(doc.splitTextToSize('Relatório elaborado a partir dos registos do escritório no LEXVORTEX. Para esclarecimentos, contacte o seu advogado.',R-ML),ML,y);

 const now=Date.now(),list=[];const at=(d,h)=>{const x=new Date(d);x.setHours(h,0,0,0);return x};
 openDl().forEach(x=>{if(x.r.pending)return;const c=caseById(x.d.caseId)||{};[[7,'faltam 7 dias'],[3,'faltam 3 dias'],[1,'termina amanhã'],[0,'termina hoje']].forEach(([o,lab])=>{const w=at(add(x.r.termo,-o),9);if(w.getTime()>now)list.push({w,title:'Prazo: '+x.d.title,body:(c.num||c.title||'')+' · '+lab+' ('+fds(x.r.termo)+')'})});

 (DB.obligations||[]).forEach(o=>{[7,1].forEach(of=>{const w=at(add(parse(o.due),-of),9);if(w.getTime()>now)list.push({w,title:'Obrigação: '+(o.label||'pagamento'),body:'Vence a '+fds(parse(o.due))})})});

function ccResults(q){const nq=normName(q).trim();if(nq.length<3)return '<p class="muted" style="margin:0">Escreva pelo menos 3 letras do nome da pessoa ou da empresa.</p>';
 const toks=nq.split(' ').filter(Boolean);const hits=ccIndex().filter(x=>{const n=normName(x.n);return toks.every(t=>n.includes(t))});

 const alert=adv.length?`<div class="warnbox" style="border-color:var(--crit);background:var(--crit-soft)"><b class="neg">Possível conflito de interesses</b><br><span style="font-size:14px">Há ${adv.length} correspondência(s) como <b>parte contrária</b>${cli.length?' e '+cli.length+' como cliente':''}. Confirme antes de aceitar o mandato (art. 99.º do Estatuto da Ordem dos Advogados).</span></div>`

 if(!sample){el.textContent='O resumo com IA não está disponível neste navegador.';return}
 const c=caseById(r.caseId),lines=r.segs.map(s=>'['+s[0]+'] '+s[1]+': '+s[2]).join('\n');
 const prompt='És assistente de '+(fem()?'uma advogada portuguesa':'um advogado português')+'. Resume esta transcrição ('+r.title+', processo '+(c.num||c.title)+'). Escreve em português europeu, 3 a 6 pontos curtos: factos referidos, contradições entre quem fala e pontos úteis para o processo. No fim de cada ponto indica entre parênteses o tempo da passagem de origem, por exemplo (00:12:05). Usa apenas o que está na transcrição; não inventes. Responde só com os pontos, um por linha, começados por "- ".\n\nTranscrição:\n'+lines;
 try{const out=await sample(prompt,{modelTier:'quick',onText:({text})=>{el.textContent=text}});r.summary=out.text;save();el.textContent=out.text}

 const hoje=TODAY.getDate()+' de '+ML[TODAY.getMonth()]+' de '+TODAY.getFullYear();const sig=`${g?'A Advogada':'O Advogado'},\n\n${pr.title} ${pr.name}\nCédula profissional n.º ${pr.cedula||'…'}`;
 if(S.doc.tpl==='proc')return {t:'PROCURAÇÃO FORENSE',b:`${v('nome')}, contribuinte n.º ${v('nif')}, com morada em ${v('morada')}, constitui ${g?'sua bastante procuradora':'seu bastante procurador'} ${L}, a quem confere os mais amplos poderes forenses em direito permitidos${f.especiais?', incluindo os poderes especiais para confessar, desistir e transigir':''}${f.subst?', e ainda os de substabelecer':''}.\n\n${v('local')}, ${hoje}.\n\n\n_______________________________\n(${f.nome||'Mandante'})`};
 if(S.doc.tpl==='carta')return {t:'INTERPELAÇÃO PARA PAGAMENTO',b:`Exmos. Senhores\n${v('dest')}\n${v('destmorada')}\n\nCarta registada com aviso de receção\n\nAssunto: Interpelação para pagamento\n\nExmos. Senhores,\n\nNa qualidade de ${g?'mandatária':'mandatário'} de ${v('nome')}, e em sua representação, venho interpelar V. Exas. para, no prazo de ${v('prazo')} dias a contar da receção da presente, procederem ao pagamento da quantia de € ${v('valor')}, referente a ${v('origem')}.\n\nFindo o referido prazo sem que o pagamento se mostre efetuado, ${g?'a':'o'} meu constituinte recorrerá aos meios judiciais ao seu dispor para cobrança do capital em dívida, acrescido de juros de mora à taxa legal e demais encargos.\n\nSem outro assunto de momento, apresento os meus melhores cumprimentos.\n\n${v('local')}, ${hoje}.\n\n${sig}`};
 return {t:'REQUERIMENTO',b:`Exmo. Senhor Juiz de Direito\n${v('tribunal')}\n\nProcesso n.º ${v('proc')}\n\n${v('nome')}, ${v('qual')} nos autos à margem referenciados, vem, através ${g?'da sua mandatária':'do seu mandatário'}, requerer a V. Exa. o adiamento da ${v('dilig')} agendada para ${v('data')}, porquanto se verifica ${v('motivo')}.\n\nPara o efeito, e com vista ao reagendamento, indica as seguintes datas alternativas: ${v('alt')}.\n\nPede deferimento.\n\n${v('local')}, ${hoje}.\n\n${sig}`};
}
function renderDoc(){if(S.doc.tpl==='meus')return;const el=$('paper');if(!el)return;const d=docText();el.innerHTML=`<div class="tt">${d.t}</div>`+esc(d.b).replace(/\[\[(.*?)\]\]/g,(m,x)=>x==='…'?'<mark>…</mark>':x)}
function plainDoc(){const d=docText();return d.t+'\n\n'+d.b.replace(/\[\[(.*?)\]\]/g,'$1')}

let toastT;function toast(m){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),3400)}
function copyText(txt,msg){const ok=()=>toast(msg);(navigator.clipboard?navigator.clipboard.writeText(txt).then(ok):Promise.reject()).catch(()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(_){toast('Não foi possível copiar. Selecione o texto.')}ta.remove()})}
document.addEventListener('click',e=>{
 const p=e.target.closest('[data-pin]');if(p){pinPress(p.dataset.pin);return}

 const a=e.target.closest('[data-act]');if(!a)return;const id=a.dataset.id;
 switch(a.dataset.act){

  case 'logout':S.logged=false;S.pin='';login();break;
  case 'reset':if(needAdmin('reset'))break;if(askConfirm('resetall')){audit('reset');resetAll()}break;

  case 'lim-int-del':if(askConfirm('lim-int-del'+id)){const [lid,iid]=id.split('|');const l=DB.limitations.find(x=>x.id===lid);if(l){l.interruptions=(l.interruptions||[]).filter(i=>i.id!==iid);save();render()}}break;
  case 'lim-del':if(askConfirm('lim-del'+id)){DB.limitations=DB.limitations.filter(x=>x.id!==id);save();render()}break;
  case 'ev-new':S.evEdit='new';S.evCase=id;S.evKind='testemunha';render();break;
  case 'ev-edit':{const ev=DB.evidence.find(x=>x.id===id);if(ev){S.evEdit=id;S.evCase=ev.caseId;render()}break}
  case 'ev-cancel':S.evEdit=null;render();break;
  case 'ev-save':saveEvid(id,a.dataset.cid);break;
  case 'ev-del':if(askConfirm('ev-del'+id)){DB.evidence=DB.evidence.filter(x=>x.id!==id);save();render()}break;
  case 'ev-rol':exportEvid(id,'rol');break;
  case 'ev-ques':exportEvid(id,'ques');break;
  case 'jd-edit':S.jdEdit=id;render();break;
  case 'jd-save':{const c=caseById(id);if(c)saveJudg(c);break}
  case 'jd-confirm':{const c=caseById(id);if(c)confirmJudg(c);break}
  case 'ar-edit':S.arEdit=id;render();break;
  case 'ar-save':{const c=caseById(id);if(c){c.archive={loc:val('ar-loc'),cab:val('ar-cab'),shelf:val('ar-shelf'),box:val('ar-box'),folder:val('ar-folder'),outTo:val('ar-out'),outSince:val('ar-out')?(val('ar-since')||key(TODAY)):''};S.arEdit=null;save();toast('Localização guardada.');render()}break}
  case 'rp-pdf':{const c=caseById(id);if(c)exportReport(c);break}
  case 'ob-add':{const due=val('ob-due');if(!due){toast('Indique a próxima data.');break}DB.obligations.push({id:nid('ob'),kind:val('ob-kind'),label:val('ob-label'),due,rec:+val('ob-rec')||0,amount:val('ob-amount')?+val('ob-amount'):null,history:[]});save();toast('Obrigação acrescentada.');render();break}
  case 'ob-paid':{const o=DB.obligations.find(x=>x.id===id);if(o){(o.history=o.history||[]).push({date:key(TODAY),amount:o.amount||null});if(+o.rec){o.due=key(addYMD(parse(o.due),0,+o.rec,0));toast('Pagamento registado. Próxima data: '+fd(parse(o.due))+'.')}else{DB.obligations=DB.obligations.filter(x=>x.id!==id);toast('Pagamento registado.')}save();render()}break}
  case 'ob-del':if(askConfirm('ob-del'+id)){DB.obligations=DB.obligations.filter(x=>x.id!==id);save();render()}break;
  case 'md-new':S.mdNew=id;render();break;
  case 'md-cancel':S.mdNew=null;render();break;
  case 'md-save':{const c=caseById(id);if(c)saveMand(c);break}
  case 'pt-make':{const c=caseById(id);const pin=val('pt-pin');if(!/^\d{4,8}$/.test(pin)){toast('O PIN deve ter 4 a 8 algarismos.');break}if(!(window.crypto&&crypto.subtle)){toast('Este navegador não permite cifrar a ficha.');break}portalFile(c,pin).then(b=>saveBlob(b,'Processo-'+(c.num||'cliente').replace(/[\/\s]+/g,'-')+'.html')).then(ok=>ok&&toast('Ficha criada. Envie o ficheiro ao cliente e diga-lhe o PIN '+pin+' por outro meio.'));break}
  case 'inb-paste':S.inbPaste=true;render();setTimeout(()=>{const t=$('inb-text');if(t)t.focus()},50);break;
  case 'inb-cancelpaste':S.inbPaste=false;render();break;
  case 'inb-parse':importNoticeText($('inb-text')?.value||'');break;
  case 'inb-ai':aiNotice(id);break;
  case 'notify-on':{if(NATIVE){const LN=NP('LocalNotifications');(LN?LN.requestPermissions():Promise.reject()).then(p=>{if(p&&p.display==='granted'){DB.profile.notify=true;save();toast('Alertas ativos, mesmo com a app fechada.');render()}else toast('O telemóvel não autorizou as notificações. Pode ativá-las nas definições do Android.')}).catch(()=>toast('Não foi possível ativar os alertas.'));break}if(!('Notification' in window)){toast('Este navegador não mostra notificações.');break}Notification.requestPermission().then(p=>{if(p==='granted'){DB.profile.notify=true;save();try{localStorage.removeItem('lv-notified-'+key(TODAY))}catch(_){}dailyNotify();toast('Avisos ativos.')}else toast('O navegador não autorizou as notificações.');render()});break}
  case 'notify-off':DB.profile.notify=false;save();if(NATIVE){const LN=NP('LocalNotifications');LN&&LN.getPending().then(p=>p&&p.notifications&&p.notifications.length&&LN.cancel({notifications:p.notifications.map(n=>({id:n.id}))})).catch(()=>{})}render();break;
  case 'jt-add':{const from=val('jt-from'),to=val('jt-to'),com=+val('jt-com'),tc=+val('jt-tc');if(!from||!to||to<from||!(com>0)||!(tc>0)){toast('Preencha o período e as duas taxas.');break}const t=jurosTable();t.push({from,to,com,tc,src:val('jt-src')});DB.jurosTab=t;save();toast('Semestre acrescentado.');render();break}
  case 'jt-del':if(askConfirm('jt-del'+id)){const t=jurosTable();t.splice(+id,1);DB.jurosTab=t;save();render()}break;
  case 'jt-reset':DB.jurosTab=null;save();render();break;
  case 'cl-add':{const d=val('cl-date');if(!d){toast('Indique a data.');break}const muni=val('cl-muni')||null;if((DB.closures||[]).some(x=>x.date===d&&(x.muni||null)===muni)){toast('Essa data já está na lista.');break}(DB.closures=DB.closures||[]).push({date:d,label:val('cl-label')||'Tolerância de ponto',muni});save();toast('Encerramento acrescentado: os prazos foram recalculados.');render();break}
  case 'cl-del':if(askConfirm('cl-del'+id)){const [d,m]=id.split('|');DB.closures=(DB.closures||[]).filter(x=>!(x.date===d&&(x.muni||'')===m));save();render()}break;
  case 'wa-gen':{const c=caseById(id);if(c)genWa(c);break}
  case 'wa-close':S.wa=null;render();break;
  case 'wa-copy':copyText($('wa-text')?.value||'','Mensagem copiada.');break;
  case 'wa-open':{const c=caseById(id),k=clientById(c.clientId)||{};const t=$('wa-text')?.value||'';const l=document.createElement('a');l.href='https://wa.me/'+waPhone(k.phone)+'?text='+encodeURIComponent(t);l.target='_blank';l.rel='noopener';document.body.appendChild(l);l.click();l.remove();break}
  case 'cc-go':{if(a.dataset.t==='case'){S.caseId=id;go('caso')}else{S.clientId=id;go('cliente')}break}
  case 'adm-ok':adminCheck();break;
  case 'adm-cancel':S.adminAsk=null;render();break;
  case 'adm-save':adminSave();break;
  case 'adm-setup-cancel':S.adminSetup=false;render();break;
  case 'adm-change':if(needAdmin('adm-change'))break;S.adminSetup=true;render();break;
  case 'audit-view':if(needAdmin('audit'))break;S.showAudit=!S.showAudit;render();break;
  case 'sigilo':{DB.profile.offline=!DB.profile.offline;audit(DB.profile.offline?'sigilo_on':'sigilo_off');save();TX_STATE=null;if(!DB.profile.offline)txCheck();toast(DB.profile.offline?'Modo sigilo ligado: nenhum dado sai deste aparelho.':'Modo sigilo desligado: transcrição e IA disponíveis.');render();break}
  case 'lock-now':lockNow();break;
  case 'sem':S.semSel=S.semSel===id?null:id;render();break;
  case 'hn-add':{const t=($('hn-text')?.value||'').trim();if(!t){toast('Escreva a nota.');break}(DB.notes=DB.notes||[]).push({id:nid('n'),caseId:id,date:key(TODAY),text:t,created:Date.now()});save();toast('Nota guardada.');render();break}
  case 'hn-del':if(askConfirm('hn-del'+id)){DB.notes=(DB.notes||[]).filter(n=>n.id!==id);save();render()}break;
  case 'hn-all':S.histAll=S.histAll===id?null:id;render();break;
  case 'install':if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.finally(()=>{deferredInstall=null;render()})}break;
  case 'rec-retry':{const r=DB.recs.find(x=>x.id===id);if(r)retryPending(r);break}
  case 'rec-tx':{const r=DB.recs.find(x=>x.id===id);if(r)txFile(r);break}
  case 'spk':S.spk=a.dataset.spk||null;render();break;
  case 'seek':{e.preventDefault();const au=$('aud-'+id);if(au&&au.src){au.currentTime=+a.dataset.t;au.play().catch(()=>{})}break}
  case 'rec-sum':summarize(id);break;
  case 'del-rec':if(askConfirm('del-rec'+id)){audioDel(id);DB.recs=DB.recs.filter(r=>r.id!==id);save();toast('Gravação apagada.');render()}break;
  case 'rec-copy':{const r=DB.recs.find(x=>x.id===id);const sel=[...document.querySelectorAll('[data-seg="'+id+'"]:checked')].map(i=>+i.value);const idx=sel.length?sel:r.segs.map((_,i)=>i);const c=caseById(r.caseId);const txt=r.title+' — '+(c?(c.num||c.title)+' — ':'')+fd(parse(r.date))+'\n\n'+idx.map(i=>{const s=r.segs[i];return '['+s[0]+'] '+s[1]+': «'+s[2]+'»'}).join('\n');copyText(txt,sel.length?(sel.length===1?'1 fala copiada.':sel.length+' falas copiadas.'):'Transcrição completa copiada.');break}
 }
});
document.addEventListener('keydown',e=>{
 if(!S.logged&&DB.profile&&e.key==='Enter'&&e.target&&e.target.id==='pin-input'&&S.pin.length>=4){pinCheck();return}
 if(!S.logged&&DB.profile&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName||'')){if(/^[0-9]$/.test(e.key)){pinPress(e.key);return}if(e.key==='Backspace'){pinPress('b');return}}
 if(e.key==='Enter'){const r=e.target.closest&&e.target.closest('tr[data-case]');if(r){S.caseId=r.dataset.case;go('caso')}const k=e.target.closest&&e.target.closest('tr[data-client]');if(k){S.clientId=k.dataset.client;go('cliente')}}
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='pin-input'){const v=t.value.replace(/\D/g,'').slice(0,pinLen());if(t.value!==v)t.value=v;S.pin=v;pinShow();if(v.length===pinLen())pinCheck();return}
 if(t.dataset&&t.dataset.pinin!==undefined){const v=t.value.replace(/\D/g,'').slice(0,6);if(t.value!==v)t.value=v;return}
 if(t.id==='q'){S.q=t.value;$('ctable').innerHTML=caseTable();return}
 if(t.dataset.pclient!==undefined){$('newclient').style.display=t.value==='__new'?'grid':'none';return}
 if(t.dataset.urgtype!==undefined){const b=$('p-urgbasis');if(b)b.value=t.value?urgBasis(t.value):'';return}
 if(t.dataset.limcat!==undefined){const cat=LIMCAT[t.value]||LIMCAT.outro;const sl=$('lim-start-l');if(sl)sl.textContent=cat.start;const ln=$('lim-len');if(ln)ln.innerHTML=limLenFields(cat);const b=$('lim-basis');if(b)b.value=cat.basis;const w=$('lim-warn');if(w)w.textContent=cat.warn||'';return}
 if(t.dataset.evkind!==undefined){S.evKind=t.value;const el=$('ev-fields');if(el)el.innerHTML=evFields(t.value,{});return}
 if(t.dataset.evst!==undefined){const ev=DB.evidence.find(x=>x.id===t.dataset.evst);if(ev){ev.status=t.value;save();render()}return}
 if(t.dataset.lockmin!==undefined){DB.profile.lockMin=+t.value;save();toast(+t.value?'A app bloqueia ao fim de '+t.value+' minuto(s) sem atividade.':'Bloqueio automático desligado.');return}
 if(t.dataset.ju!==undefined){S.jur[t.dataset.ju]=t.type==='checkbox'?t.checked:t.value;if(t.dataset.ju==='type'){render();return}renderJuros();return}
 if(t.dataset.rcpv!==undefined){S.rcpVal=t.value;const el=$('rc-out');if(el)el.innerHTML=rcpOut(rcpEstimate(+t.value||0,S.rcpCol||'A'));return}
 if(t.dataset.rp!==undefined){if(t.dataset.rp==='from')S.rpFrom=t.value;else S.rpTo=t.value;return}
 if(t.dataset.ptnote!==undefined){S.ptNote=t.value;return}
 if(t.dataset.mdst!==undefined){mandStatus(t.dataset.mdst,t.value);return}
 if(t.dataset.ccq!==undefined){S.ccQ=t.value;const el=$('cc-res');if(el)el.innerHTML=ccResults(t.value);return}
 if(t.dataset.cq!==undefined){S.cq=t.value;const el=$('cl-list');if(el)el.innerHTML=clientRows(t.value);return}
 if(t.dataset.ctq!==undefined){S.ctq=t.value;const el=$('ct-list');if(el)el.innerHTML=contactRows(t.value);return}
 if(t.dataset.itype!==undefined){S.itype=t.value;const el=$('i-fields');if(el)el.innerHTML=incFields(t.value);return}
 if(t.dataset.xcat!==undefined){const cb=$('x-reemb');if(cb)cb.checked=!!EXP_REEMB[t.value];return}
 if(t.dataset.ncase!==undefined){const el=$('n-exp-list');if(el)el.innerHTML=feeExpHtml(t.value);const c=caseById(t.value);const cs=$('n-client');if(c&&cs)cs.value=c.clientId;return}
 if(t.dataset.tmdesc!==undefined){if(DB.timer){DB.timer.desc=t.value;save()}return}
 if(t.dataset.lvcase!==undefined){S.liveCase=t.value;return}
 if(t.dataset.c!==undefined){const k=t.dataset.c;S.calc[k]=t.type==='checkbox'?t.checked:t.value;
  if(k==='tpl'){const tp=TPL[t.value];S.calc.days=tp.days;S.calc.triggerType=tp.trigger;S.calc.title=tp.name;render();return}
  if(k==='caseId'){const c=caseById(t.value);if(c){S.calc.court=c.court;S.calc.urgent=!!c.urgentLegal}render();return}
  if(k!=='title')renderCalc();return}
 if(t.dataset.df!==undefined){S.doc.f[t.dataset.df]=t.type==='checkbox'?t.checked:t.value;renderDoc();return}
 if(t.dataset.dcase!==undefined){S.doc.caseId=t.value;docPrefill();render();return}
 if(t.dataset.h!==undefined){S.fee[t.dataset.h]=t.type==='checkbox'?t.checked:t.value;renderFee();return}
 if(t.dataset.rqall!==undefined){const v=t.value.toLowerCase();document.querySelectorAll('[data-rc="'+t.dataset.rqall+'"]').forEach(r=>{r.style.display=r.textContent.toLowerCase().includes(v)&&(!S.spk||r.dataset.spk===S.spk)?'':'none'});return}
 if(t.dataset.rq!==undefined){const v=t.value.toLowerCase();document.querySelectorAll('[data-row="'+t.dataset.rq+'"]').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(v)?'':'none');return}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset&&t.dataset.inbox!==undefined){const fs=[...(t.files||[])];t.value='';fs.forEach(f=>importNotif(f));return}
 if(t.dataset&&t.dataset.docfile){const fs=[...(t.files||[])];if(fs.length)addDocs(t.dataset.docfile,fs);t.value='';return}
 if(t.dataset&&t.dataset.backup!==undefined){const f=t.files&&t.files[0];t.value='';if(!f)return;f.text().then(x=>{try{const o=JSON.parse(x);if(o.app!=='LEXVORTEX'||!Array.isArray(o.cases))throw 0;S.pendingImport=o;render()}catch(_){toast('Este ficheiro não é uma cópia de segurança da LEXVORTEX.')}});return}
 if(t.dataset&&t.dataset.file){const f=t.files&&t.files[0];if(f)attachFile(t.dataset.file,f);t.value='';return}
 if(t.tagName==='SELECT'||t.type==='checkbox'||t.type==='date')t.dispatchEvent(new Event('input',{bubbles:true}))},true);

document.addEventListener('focusout',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.edit){const r=DB.recs.find(x=>x.id===t.dataset.edit);const i=+t.dataset.i;if(r&&r.segs[i]){const v=t.textContent.trim();if(v&&v!==r.segs[i][2]){r.segs[i][2]=v;save();toast('Correção guardada.')}}}});
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&S.live&&!S.live.stopping){try{S.live.wake=await navigator.wakeLock.request('screen')}catch(_){}try{S.live.ctx.resume()}catch(_){}}});
window.addEventListener('beforeunload',e=>{if(S.live){e.preventDefault();e.returnValue=''}});
try{const th=localStorage.getItem('lv-theme');if(th)document.documentElement.dataset.theme=th}catch(_){}
if('serviceWorker' in navigator&&/github\.io$/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{});
load();idbOpen();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
try{const h=(location.hash||'').slice(1);if(h&&VIEWS[h]&&!['caso','cliente','novo-proc'].includes(h))S.view=h}catch(_){}
if(!DB.profile)onboarding();else login();
</script>
