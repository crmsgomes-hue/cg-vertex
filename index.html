<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LEXVORTEX — Secretária Digital Jurídica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F3F7;--surface:#FFFFFF;--surface2:#F7F8FB;--text:#18203A;--muted:#5B6478;--line:#DCE1EA;
  --navy:#14213D;--navy2:#1E2F55;--on-navy:#FFFFFF;--on-navy-muted:#A9B4CC;
  --accent:#C95C0C;--accent-soft:#FBEADB;--on-accent:#FFFFFF;
  --crit:#C62828;--crit-soft:#FBE4E4;--warn:#B85F00;--warn-soft:#FDEFD9;--att:#8A6D00;--att-soft:#FAF3D2;
  --ok:#1D7A63;--ok-soft:#DDF1EA;--cnt:#E3E9F4;--closed:#ECEEF2;
  --shadow:0 1px 2px rgba(20,33,61,.06);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D1424;--surface:#152036;--surface2:#1A2640;--text:#E7EBF4;--muted:#9AA6BE;--line:#27344F;
  --navy:#0A1020;--navy2:#18264A;--on-navy:#FFFFFF;--on-navy-muted:#8F9BB5;
  --accent:#E47A2A;--accent-soft:#3A2614;--on-accent:#1A0E04;
  --crit:#F0625F;--crit-soft:#3B1A1D;--warn:#F0A04B;--warn-soft:#3A2A14;--att:#E2C24F;--att-soft:#352F15;
  --ok:#4CC3A2;--ok-soft:#143229;--cnt:#22335A;--closed:#1C2538;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0D1424;--surface:#152036;--surface2:#1A2640;--text:#E7EBF4;--muted:#9AA6BE;--line:#27344F;
  --navy:#0A1020;--navy2:#18264A;--on-navy:#FFFFFF;--on-navy-muted:#8F9BB5;
  --accent:#E47A2A;--accent-soft:#3A2614;--on-accent:#1A0E04;
  --crit:#F0625F;--crit-soft:#3B1A1D;--warn:#F0A04B;--warn-soft:#3A2A14;--att:#E2C24F;--att-soft:#352F15;
  --ok:#4CC3A2;--ok-soft:#143229;--cnt:#22335A;--closed:#1C2538;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--text);font:15px/1.5 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
.serif{font-family:'IBM Plex Serif',Georgia,'Times New Roman',serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;line-height:1.2}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Login */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:var(--navy);color:var(--on-navy);padding:24px}
.login-box{width:100%;max-width:340px;text-align:center}
.brand{font-weight:700;letter-spacing:.14em;font-size:22px}
.brand span{color:var(--accent)}
.login p.slogan{color:var(--on-navy-muted);margin:8px 0 36px;font-size:14px}
.pin-dots{display:flex;justify-content:center;gap:16px;margin:8px 0 10px}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--on-navy-muted)}
.pin-dots i.on{background:var(--accent);border-color:var(--accent)}
.pin-msg{min-height:22px;font-size:13px;color:var(--on-navy-muted)}
.pin-msg.err{color:#FF9C8F}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.pad button{height:64px;border-radius:16px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:var(--on-navy);font-size:24px;font-weight:500}
.pad button:active{background:rgba(255,255,255,.16)}
.pad .ghost{background:none;border:none;font-size:14px;color:var(--on-navy-muted)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.who{margin-bottom:24px;font-size:14px;color:var(--on-navy-muted)}
.who b{display:block;color:var(--on-navy);font-size:17px;font-weight:600}

/* Shell */
.shell{display:flex;min-height:100vh;min-height:100dvh}
.side{display:none}
.main{flex:1;min-width:0;padding-bottom:96px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
.top .brand{font-size:16px;color:var(--text)}
.top-right{display:flex;gap:8px;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--navy2);color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px;border:none}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.view{max-width:1120px;margin:0 auto;padding:20px 18px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;min-height:56px;font-size:11px;color:var(--muted);border-radius:10px}
.nav button.on{color:var(--accent);font-weight:600}
.nav svg{width:24px;height:24px}
@media (min-width:900px){
  .side{display:flex;flex-direction:column;width:236px;flex:0 0 236px;background:var(--navy);color:var(--on-navy);padding:28px 16px;position:sticky;top:0;height:100vh}
  .side .brand{color:var(--on-navy);font-size:18px;padding:0 10px}
  .side .slogan{color:var(--on-navy-muted);font-size:12px;padding:4px 10px 28px;line-height:1.4}
  .side button{display:flex;align-items:center;gap:12px;border:none;background:none;color:var(--on-navy-muted);padding:12px;border-radius:10px;font-size:15px;text-align:left;min-height:48px}
  .side button svg{width:20px;height:20px}
  .side button.on{background:var(--navy2);color:var(--on-navy);font-weight:600}
  .side button.on svg{color:var(--accent)}
  .side .foot{margin-top:auto;font-size:12px;color:var(--on-navy-muted);padding:10px}
  .nav,.top .brand{display:none}
  .top{justify-content:flex-end}
  .main{padding-bottom:40px}
  .view{padding:28px 32px}
}

/* Common */
.h-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.h-row h1{font-size:26px;font-weight:600}
.h-row p{margin:4px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.pad-card{padding:18px}
.sec-t{font-size:16px;font-weight:600;margin:0 0 12px}
.grid2{display:grid;gap:18px}
@media (min-width:900px){.grid2{grid-template-columns:1.25fr 1fr}}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.dark{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.l-crit{color:var(--crit);background:var(--crit-soft)}
.l-urg{color:var(--warn);background:var(--warn-soft)}
.l-att{color:var(--att);background:var(--att-soft)}
.l-norm{color:var(--muted);background:var(--surface2)}
.l-ok{color:var(--ok);background:var(--ok-soft)}
.pos{color:var(--ok);font-weight:600}.neg{color:var(--crit);font-weight:600}
.muted{color:var(--muted)}
.back{border:none;background:none;color:var(--muted);padding:8px 0;margin-bottom:6px;font-weight:500;min-height:44px}

/* Alert banner */
.alert{display:grid;grid-template-columns:1fr auto;gap:14px 18px;align-items:center;background:var(--crit);color:#fff;border-radius:16px;padding:18px 20px;margin-bottom:18px}
.alert .k{font-size:13px;opacity:.9;margin:0}
.alert h2{font-size:21px;font-weight:600;margin:2px 0}
.alert .meta{margin:0;font-size:14px;opacity:.92}
.alert .when{text-align:center;line-height:1}
.alert .when b{display:block;font-size:52px;font-weight:600}
.alert .when span{font-size:13px}
.alert .acts{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
.alert .acts .btn{background:#fff;color:#8E1515;border-color:#fff}
.alert .acts .btn.o{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
:root[data-theme="dark"] .alert, .alert{}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .alert{background:#7A1C1F}}
:root[data-theme="dark"] .alert{background:#7A1C1F}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}
@media (min-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{padding:16px;border:1px solid var(--line);background:var(--surface);border-radius:14px;text-align:left;min-height:112px;display:flex;flex-direction:column;justify-content:space-between}
.kpi b{font-size:30px;font-weight:600;line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.hot b{color:var(--crit)}

/* Deadline rows */
.dl{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:none;background:none;padding:12px 4px;border-bottom:1px solid var(--line);min-height:64px}
.dl:last-child{border-bottom:none}
.dl .d{width:56px;flex:0 0 56px;text-align:center;line-height:1.05}
.dl .d b{display:block;font-size:22px;font-weight:600}
.dl .d small{font-size:11.5px;color:var(--muted)}
.dl .t{flex:1;min-width:0}
.dl .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl .t small{color:var(--muted);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev{display:flex;gap:14px;padding:12px 4px;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:none}
.ev .tm{width:56px;flex:0 0 56px;font-weight:600;text-align:center}
.ev .bar{width:4px;border-radius:4px;flex:0 0 4px}
.ev .tt b{display:block;font-weight:600}
.ev .tt small{color:var(--muted);font-size:13px}

/* Tables */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.seg{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 16px;min-height:44px;font-weight:500}
.seg.on{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.search{flex:1;min-width:200px;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 18px}
.tscroll{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:var(--accent);color:var(--on-accent);text-align:left;font-weight:600;padding:12px 14px;white-space:nowrap}
.tbl td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:nth-child(even) td{background:var(--surface2)}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--accent-soft)}
.tbl .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:700;border-top:2px solid var(--line)}
.mono{font-variant-numeric:tabular-nums;white-space:nowrap}

/* Forms */
.form{display:grid;gap:14px}
.f label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 14px}
.f textarea{min-height:90px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:12px;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--surface);font-weight:500}
.check input{width:22px;height:22px;accent-color:var(--accent)}

/* Calculator result */
.termo{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin:4px 0 14px}
.termo .big{font-size:52px;font-weight:600;line-height:1;color:var(--text)}
.termo .wd{color:var(--muted);font-size:15px;margin-top:6px}
.termo .left{padding-bottom:6px}
.strip-wrap{overflow-x:auto;padding:4px 0 10px;margin:0 -4px}
.strip{display:flex;gap:3px;padding:0 4px;min-width:max-content}
.cell{width:30px;flex:0 0 30px;text-align:center;border-radius:7px;padding:5px 0 4px;font-size:12px;line-height:1.15;background:var(--cnt);color:var(--text)}
.cell small{display:block;font-size:9.5px;color:var(--muted)}
.cell.ev{background:none;border:2px solid var(--navy2);padding:3px 0 2px}
.cell.cl{background:var(--closed);color:var(--muted)}
.cell.susp{background:repeating-linear-gradient(135deg,var(--accent-soft) 0 5px,transparent 5px 9px);border:1px solid var(--accent);color:var(--accent)}
.cell.tm{background:var(--crit);color:#fff}
.cell.tm small{color:#fff}
.cell.gr{background:var(--warn-soft);border:1px solid var(--warn);color:var(--warn)}
.mlab{font-size:11px;color:var(--muted);height:16px;white-space:nowrap}
.col{display:flex;flex-direction:column}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin-bottom:14px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.steps{margin:0;padding-left:20px;display:grid;gap:8px;font-size:14px}
.steps li::marker{color:var(--accent);font-weight:700}
.note{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:10px 12px;margin-top:14px}

/* Minutas */
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px}
.paper{background:#FFFFFF;color:#1B1B1B;border-radius:6px;padding:36px 34px;border:1px solid var(--line);font-family:'IBM Plex Serif',Georgia,serif;font-size:15px;line-height:1.75;white-space:pre-wrap;min-height:480px}
.paper .tt{text-align:center;font-weight:600;letter-spacing:.06em;margin-bottom:18px}
.paper mark{background:#FDEBD3;color:#7A3A06;border-radius:3px;padding:0 3px}
.tool{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

/* Fees */
.calc-out{display:grid;gap:0;margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.calc-out div{display:flex;justify-content:space-between;padding:12px 14px;border-top:1px solid var(--line)}
.calc-out div:first-child{border-top:none}
.calc-out div.tot{background:var(--accent-soft);font-weight:700;font-size:17px}

/* Case detail */
.info{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 18px;font-size:14px}
@media (min-width:900px){.info{grid-template-columns:repeat(4,1fr)}}
.info span{display:block;color:var(--muted);font-size:12.5px}
.info b{font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy2);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90vw}
@media (min-width:900px){.toast{bottom:32px}}
.live-top{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--crit);border-radius:14px;padding:14px 16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);z-index:5}
.spk-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.spk-chips .seg{min-height:52px;white-space:nowrap}
.live-big{margin-top:14px;padding-bottom:40px}
.live-big .trow{font-size:19px;line-height:1.6}
.live-big .ts{flex-basis:76px;font-size:13px;padding-top:4px}
.recbox{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.trow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.trow input{width:20px;height:20px;margin-top:1px;accent-color:var(--accent);flex:0 0 20px}
.trow .ts{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600;flex:0 0 64px}
.trow .spk{font-weight:600}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.onb{max-width:440px;text-align:left}
.onb h2{color:var(--on-navy)}
.onb .f label{color:var(--on-navy-muted)}
.ghost-link{background:none;border:none;color:var(--on-navy-muted);margin-top:22px;min-height:44px;font-size:14px;text-decoration:underline}
.row-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.subform{border-left:3px solid var(--accent);padding-left:14px}
.start{text-align:center;padding:36px 20px}
.start .btn{margin-top:8px}
.danger{color:var(--crit)}
.danger-on{background:var(--crit);color:#fff;border-color:var(--crit)}
.lvl{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px;max-width:320px}
.lvl i{display:block;height:100%;width:0;background:var(--ok);transition:width .12s}
.tips{margin:0;padding-left:20px;color:var(--muted);font-size:14px;display:grid;gap:6px}
.spk-btn{border:none;background:none;padding:0;font-weight:600;color:var(--text);cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.seg-text{outline:none;border-radius:4px}
.seg-text:focus{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft)}
.seg-body{flex:1;min-width:0}
.cal-links{display:flex;gap:16px;flex-wrap:wrap;padding:0 4px 10px 78px;font-size:13px;border-bottom:1px solid var(--line)}
.cal-links a,.cal-links button{color:var(--accent);background:none;border:none;padding:6px 0;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;min-height:36px}
.ev{border-bottom:none}
.exp-pick{display:grid;gap:8px}
.exp-pick .check{gap:10px}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ---------- Datas e calendário judicial ---------- */
const M=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const ML=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const WD=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const WDS=['D','S','T','Q','Q','S','S'];
const D=(y,m,d)=>new Date(y,m,d,12);
const TODAY=(()=>{const n=new Date();return D(n.getFullYear(),n.getMonth(),n.getDate())})();
const add=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r};
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const [y,m,d]=String(s).split('-').map(Number);return D(y,m-1,d)};
const diff=(a,b)=>Math.round((b-a)/864e5);
const fd=d=>d.getDate()+' '+M[d.getMonth()]+' '+d.getFullYear();
const fds=d=>d.getDate()+' '+M[d.getMonth()];
const fdl=d=>WD[d.getDay()]+', '+d.getDate()+' de '+ML[d.getMonth()];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return D(y,mo-1,da)}
const HC={};
function natHol(y){if(HC[y])return HC[y];const e=easter(y),h={};
 [[0,1,'Ano Novo'],[3,25,'Dia da Liberdade'],[4,1,'Dia do Trabalhador'],[5,10,'Dia de Portugal'],[7,15,'Assunção de Nossa Senhora'],[9,5,'Implantação da República'],[10,1,'Todos os Santos'],[11,1,'Restauração da Independência'],[11,8,'Imaculada Conceição'],[11,25,'Natal']].forEach(([m,d,n])=>h[key(D(y,m,d))]=n);
 h[key(add(e,-2))]='Sexta-feira Santa';h[key(e)]='Páscoa';h[key(add(e,60))]='Corpo de Deus';return HC[y]=h}
const MUNIS={lisboa:['Lisboa',[5,13]],porto:['Porto',[5,24]],braga:['Braga',[5,24]],guimaraes:['Guimarães',[5,24]],coimbra:['Coimbra',[6,4]],aveiro:['Aveiro',[4,12]],viseu:['Viseu',[8,21]],leiria:['Leiria',[4,22]],caldas:['Caldas da Rainha',[4,15]],santarem:['Santarém',[2,19]],sintra:['Sintra',[5,29]],cascais:['Cascais',[5,13]],almada:['Almada',[5,24]],setubal:['Setúbal',[8,15]],evora:['Évora',[5,29]],faro:['Faro',[8,7]],funchal:['Funchal',[7,21]],outro:['Outro município',null]};
const courtOf=k=>{const m=MUNIS[k]||MUNIS.outro;return {city:m[0],mh:m[1]}};
function holName(d,c){const n=natHol(d.getFullYear())[key(d)];if(n)return n;if(c&&c.mh&&d.getMonth()===c.mh[0]&&d.getDate()===c.mh[1])return 'Feriado municipal de '+c.city;return null}
const weekend=d=>d.getDay()===0||d.getDay()===6;
const closed=(d,c)=>weekend(d)||!!holName(d,c);
function judHol(d){const m=d.getMonth(),dd=d.getDate();if((m===11&&dd>=22)||(m===0&&dd<=3))return 'Natal';if((m===6&&dd>=16)||m===7)return 'verão';const e=easter(d.getFullYear()),t=d.getTime();if(t>=add(e,-7).getTime()&&t<=add(e,1).getTime())return 'Páscoa';return null}
function closedWhy(d,c){if(d.getDay()===6)return 'sábado';if(d.getDay()===0)return 'domingo';return holName(d,c)}
const TPL={
 contest:{name:'Contestação',days:30,regime:'cpc',basis:'art. 569.º CPC',trigger:'citation'},
 apel:{name:'Recurso de apelação',days:30,regime:'cpc',basis:'art. 638.º CPC',trigger:'electronic'},

const TRIG={electronic:'Notificação eletrónica (Citius)',postal:'Carta registada',citation:'Citação',direct:'Data do evento'};
function compute(p){
 const c=courtOf(p.court);const steps=[];const cells=[];let start=p.trigger;
 if(p.triggerType==='electronic'||p.triggerType==='postal'){
  let pr=add(p.trigger,3);
  steps.push((p.triggerType==='electronic'?'Notificação elaborada':'Carta registada')+' a '+fd(p.trigger)+'; presume-se feita no 3.º dia posterior, '+fd(pr)+' ('+(p.triggerType==='electronic'?'art. 248.º':'art. 249.º')+' CPC).');
  if(closed(pr,c)){const w=closedWhy(pr,c);while(closed(pr,c))pr=add(pr,1);steps.push('Esse dia não é útil ('+w+'): a notificação considera-se feita a '+fd(pr)+'.')}
  start=pr;
 }else if(p.triggerType==='citation')steps.push('Citação a '+fd(p.trigger)+'.');
 else steps.push('Evento a '+fd(p.trigger)+'.');
 const suspend=p.regime!=='substantive'&&!p.urgent&&p.days<180;
 const total=p.days+(p.dil||0);
 if(p.dil)steps.push('Dilação de '+p.dil+' dias somada ao prazo de '+p.days+' dias: '+total+' dias (art. 245.º CPC).');
 cells.push({d:start,t:'ev'});
 let d=start,n=0,sus=0;
 while(n<total){d=add(d,1);if(suspend&&judHol(d)){cells.push({d,t:'susp'});sus++;continue}n++;cells.push({d,t:closed(d,c)?'cl':'cnt',n})}
 if(p.regime==='substantive')steps.push('Prazo substantivo de '+total+' dias, contado a partir do dia seguinte (art. 279.º, al. b) CC); não se suspende em férias judiciais.');
 else steps.push('Prazo contínuo de '+total+' dias, a contar do dia seguinte, '+fd(add(start,1))+' (art. 138.º, n.º 1 CPC e art. 279.º, al. b) CC).');
 if(sus)steps.push(sus+' dias não contados por coincidirem com férias judiciais (art. 138.º, n.º 1 CPC; art. 28.º LOSJ).');
 if(p.urgent&&p.regime!=='substantive')steps.push('Processo urgente: o prazo corre durante as férias judiciais.');
 let t=d;
 const blocked=x=>p.regime==='substantive'?(x.getDay()===0||!!holName(x,c)):closed(x,c);
 if(blocked(t)){const w=closedWhy(t,c);const first=t;cells[cells.length-1].t='cl';while(blocked(t)){t=add(t,1);if(blocked(t))cells.push({d:t,t:'cl'})}cells.push({d:t,t:'tm'});steps.push('Terminaria a '+fd(first)+' ('+w+'); transfere-se para o 1.º dia útil seguinte, '+fd(t)+' ('+(p.regime==='substantive'?'art. 279.º, al. e) CC':'art. 138.º, n.º 2 CPC')+').')}
 else cells[cells.length-1].t='tm';
 let g=null;
 if(p.regime!=='substantive'){g=t;let k=0;while(k<3){g=add(g,1);if(closed(g,c)||(suspend&&judHol(g))){cells.push({d:g,t:'cl'});continue}k++;cells.push({d:g,t:'gr',n:k})}
  steps.push('O ato ainda pode ser praticado até '+fd(g)+', com multa de 10%, 25% ou 40% da taxa de justiça, conforme o dia (art. 139.º, n.º 5 CPC).')}
 return {start,termo:t,grace:g,steps,cells,sus};
}

function cutChunk(L){if(!L.bufLen)return;const all=new Int16Array(L.bufLen);let o=0;for(const p of L.buf){all.set(p,o);o+=p.length}

 const ch=$('spk-chips');if(ch)ch.innerHTML=L.speakers.length>1?L.speakers.map((n,i)=>`<button class="seg ${i===L.spk?'on':''}" data-act="spk-set" data-i="${i}">${esc(n)}</button>`).join(''):'';

 const mrDone=new Promise(res=>{if(L.mr&&L.mr.state!=='inactive'){L.mr.onstop=res;try{L.mr.stop()}catch(_){res()}}else res()});

 const wait=()=>{if((!L.queue.length&&!L.busy)||TX_STATE===false||(L.netErr>=3&&!L.busy))mrDone.then(()=>finalize(L));else setTimeout(wait,400)};wait()}

 const pend=[...L.failed,...L.queue];L.queue=[];
 const blob=L.chunks.length?new Blob(L.chunks,{type:(L.mr&&L.mr.mimeType)||'audio/webm'}):null;
 const r={id:L.rid,caseId:L.id,kind:L.kind,title:L.kind==='note'?'Nota ditada':'Transcrição em direto',date:key(TODAY),created:Date.now(),dur:fmtDur(Math.max(1,Math.round(L.samples/16000))),segs:L.segs,hasAudio:!!blob,speakers:L.speakers,spkLog:L.spkLog,pending:pend.map(p=>({idx:p.idx,start:p.start}))};

async function retryPending(r){if(S.txBusy)return;S.txBusy=r.id;render();let ok=0;

  try{const j=await sendChunk(new File([b],'excerto.wav',{type:'audio/wav'}),promptFrom(r.segs));addSegs(r.segs,r.speakers||DEF_SPK(),r.spkLog,p.start,j.segments);r.pending=r.pending.filter(x=>x!==p);audioDel(r.id+':p'+p.idx);ok++;save()}
  catch(e){toast(txErrMsg(e));break}}

async function txFile(r){if(S.txBusy)return;S.txBusy=r.id;S.txProg='';render();
 try{let b=await audioGet(r.id);if(!b&&AURL[r.id])b=await fetch(AURL[r.id]).then(x=>x.blob());if(!b)throw Object.assign(new Error('x'),{code:'nofile'});

  else{S.txProg='A preparar o ficheiro…';updProg();const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;const buf=await new OAC(1,16000,16000).decodeAudioData(await b.arrayBuffer());

function recMeta(r){const c=caseById(r.caseId)||{},cl=clientById(c.clientId)||{};return [['Processo',c.num||'—'],['Assunto',c.title||'—'],['Tribunal',c.courtName||'—'],['Cliente',cl.name||'—'],['Parte adversa',c.adv||'—'],['Registo',(RK[r.kind]||RK.live)[1]],['Data',fd(parse(r.date))],['Duração',r.dur],['Elaborada por',LNAME()+(P().cedula?', cédula profissional n.º '+P().cedula:'')]]}

async function saveBlob(blob,name){let dl=null;try{dl=window.claude&&typeof window.claude.use==='function'?await window.claude.use('downloads'):null}catch(_){}

function buildPdf(r,J){const doc=new J({unit:'mm',format:'a4'});const W=210,H=297,ML=20,MR=20,TW=W-ML-MR;let y=22;
 const need=h=>{if(y+h>H-20){doc.addPage();y=22}};
 doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text('TRANSCRIÇÃO',W/2,y,{align:'center'});y+=10;
 doc.setFontSize(10);
 for(const [k,v] of recMeta(r)){const lines=doc.splitTextToSize(String(v),TW-38);need(lines.length*5);doc.setFont('helvetica','bold');doc.text(k,ML,y);doc.setFont('helvetica','normal');doc.text(lines,ML+38,y);y+=lines.length*5}
 y+=2;doc.setDrawColor(200);doc.line(ML,y,W-MR,y);y+=6;
 doc.setFont('helvetica','italic');doc.setFontSize(9);doc.setTextColor(90);const nl=doc.splitTextToSize(EXP_NOTE,TW);doc.text(nl,ML,y);y+=nl.length*4.5+4;doc.setTextColor(0);
 for(const s of r.segs){doc.setFontSize(10.5);const lines=doc.splitTextToSize(String(s[2]),TW-6);need(6+lines.length*5.2);
  doc.setFont('helvetica','normal');doc.setTextColor(120);doc.text('['+s[0]+']',ML,y);doc.setTextColor(0);doc.setFont('helvetica','bold');doc.text(String(s[1]),ML+22,y);y+=5.4;
  doc.setFont('helvetica','normal');doc.text(lines,ML+6,y);y+=lines.length*5.2+3}
 const n=doc.getNumberOfPages(),c=caseById(r.caseId)||{};
 for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(120);doc.text('Processo '+(c.num||c.title||''),ML,H-10);doc.text('Página '+i+' de '+n,W-MR,H-10,{align:'right'});doc.setTextColor(0)}
 return doc.output('blob')}
function buildDocx(r,X){const {Document,Paragraph,TextRun,Table,TableRow,TableCell,WidthType,AlignmentType,BorderStyle,Footer,Header,PageNumber}=X;
 const thin={style:BorderStyle.SINGLE,size:4,color:'D0D5DD'};const borders={top:thin,bottom:thin,left:thin,right:thin,insideHorizontal:thin,insideVertical:thin};
 const meta=new Table({width:{size:100,type:WidthType.PERCENTAGE},borders,rows:recMeta(r).map(([k,v])=>new TableRow({children:[new TableCell({width:{size:26,type:WidthType.PERCENTAGE},children:[new Paragraph({children:[new TextRun({text:k,bold:true})]})]}),new TableCell({width:{size:74,type:WidthType.PERCENTAGE},children:[new Paragraph({children:[new TextRun(String(v))]})]})]}))});
 const body=r.segs.map(s=>new Paragraph({spacing:{after:140},children:[new TextRun({text:'['+s[0]+']  ',color:'7A7F8C'}),new TextRun({text:s[1]+': ',bold:true}),new TextRun(String(s[2]))]}));
 const c=caseById(r.caseId)||{};
 const doc=new Document({creator:LNAME(),title:'Transcrição — '+(c.num||c.title||''),styles:{default:{document:{run:{font:'Arial',size:22}}}},
  sections:[{properties:{page:{margin:{top:1134,bottom:1134,left:1134,right:1134}}},
  headers:{default:new Header({children:[new Paragraph({alignment:AlignmentType.RIGHT,children:[new TextRun({text:'Processo '+(c.num||c.title||''),size:16,color:'7A7F8C'})]})]})},
  footers:{default:new Footer({children:[new Paragraph({alignment:AlignmentType.RIGHT,children:[new TextRun({children:['Página ',PageNumber.CURRENT,' de ',PageNumber.TOTAL_PAGES],size:16,color:'7A7F8C'})]})]})},
  children:[new Paragraph({alignment:AlignmentType.CENTER,spacing:{after:240},children:[new TextRun({text:'TRANSCRIÇÃO',bold:true,size:32})]}),meta,
   new Paragraph({spacing:{before:240,after:240},children:[new TextRun({text:EXP_NOTE,italics:true,size:18,color:'5B6478'})]}),...body]}]});

async function exportRec(r,kind){if(!r.segs.length)return toast('Esta gravação ainda não tem texto para exportar.');S.expBusy=r.id+kind;render();

function loadLib(src,glob){return new Promise((res,rej)=>{if(window[glob])return res(window[glob]);const s=document.createElement('script');s.src=src;s.onload=()=>window[glob]?res(window[glob]):rej(new Error('load'));s.onerror=()=>rej(new Error('load'));document.head.appendChild(s)})}
const fmtSize=b=>b<1024*1024?Math.max(1,Math.round(b/1024))+' KB':(b/1048576).toFixed(1).replace('.',',')+' MB';
const fmtMin=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?h+' h'+(r?' '+r+' min':''):r+' min'};

/* ---------- Documentos do processo ---------- */
const MNUM={janeiro:0,fevereiro:1,'março':2,marco:2,abril:3,maio:4,junho:5,julho:6,agosto:7,setembro:8,outubro:9,novembro:10,dezembro:11};
function findDates(text){const found=new Map();const push=(y,m,d)=>{if(y<100)y+=2000;const dt=D(y,m,d);if(dt.getMonth()!==m||dt.getDate()!==d)return;const k=key(dt);found.set(k,(found.get(k)||0)+1)};
 for(const x of text.matchAll(/\b(\d{1,2})[-.\/](\d{1,2})[-.\/](\d{4})\b/g))push(+x[3],+x[2]-1,+x[1]);
 for(const x of text.matchAll(/\b(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})\b/g))push(+x[1],+x[2]-1,+x[3]);
 for(const x of text.toLowerCase().matchAll(/\b(\d{1,2})\s+de\s+(janeiro|fevereiro|março|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)\s+de\s+(\d{4})\b/g))push(+x[3],MNUM[x[2]],+x[1]);
 return [...found.keys()].filter(k=>{const x=diff(parse(k),TODAY);return x>=-60&&x<=400}).sort((a,b)=>Math.abs(diff(parse(a),TODAY))-Math.abs(diff(parse(b),TODAY))).slice(0,6)}
async function scanPdf(d,file){d.scanning=true;render();
 try{const lib=await loadLib(LIB_PDFJS,'pdfjsLib');lib.GlobalWorkerOptions.workerSrc=LIB_PDFJS_W;const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  let text='';for(let i=1;i<=Math.min(pdf.numPages,5);i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();text+=tc.items.map(t=>t.str).join(' ')+'\n'}
  d.dates=findDates(text);d.hasText=text.trim().length>20}

/* ---------- Eventos ---------- */
let toastT;function toast(m){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),3400)}
function copyText(txt,msg){const ok=()=>toast(msg);(navigator.clipboard?navigator.clipboard.writeText(txt).then(ok):Promise.reject()).catch(()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(_){toast('Não foi possível copiar. Selecione o texto.')}ta.remove()})}
document.addEventListener('click',e=>{
 const p=e.target.closest('[data-pin]');if(p){pinPress(p.dataset.pin);return}

  case 'del-case':if(askConfirm('del-case'+id)){DB.recs.filter(r=>r.caseId===id).forEach(r=>audioDel(r.id));DB.recs=DB.recs.filter(r=>r.caseId!==id);DB.deadlines=DB.deadlines.filter(d=>d.caseId!==id);DB.events=DB.events.filter(x=>x.caseId!==id);DB.docs.filter(d=>d.caseId===id).forEach(d=>audioDel('doc:'+d.id));DB.docs=DB.docs.filter(d=>d.caseId!==id);DB.time=DB.time.filter(t=>t.caseId!==id);DB.expenses=DB.expenses.filter(x=>x.caseId!==id);if(DB.timer&&DB.timer.caseId===id)DB.timer=null;DB.fees.forEach(f=>{if(f.caseId===id)f.caseId=null});DB.cases=DB.cases.filter(c=>c.id!==id);save();toast('Processo apagado.');go('processos')}break;

  case 'copy':{const d=currentDoc();if(d)copyText(d.t+'\n\n'+d.b,'Texto copiado.');break}

  case 'ev-open':S.evOpen=true;S.evCase=null;if(S.view!=='agenda')go('agenda');else render();break;

  case 'exp-add':S.expAdd=id;render();break;
  case 'exp-cancel':S.expAdd=null;render();break;
  case 'exp-save':{const amount=+val('x-amount');if(!(amount>0)){toast('Indique o valor da despesa.');break}const cat=val('x-cat');DB.expenses.push({id:nid('x'),caseId:id,date:val('x-date')||key(TODAY),cat,desc:val('x-desc')||catName(cat),amount:Math.round(amount*100)/100,reemb:chk('x-reemb'),paidBy:val('x-paid')||'office',billed:false,created:Date.now()});S.expAdd=null;save();toast('Despesa registada.');render();break}
  case 'exp-del':if(askConfirm('exp-del'+id)){DB.expenses=DB.expenses.filter(x=>x.id!==id);save();render()}break;
  case 'fee-pdf':{const f=DB.fees.find(x=>x.id===id);if(f)exportFee(f);break}
  case 'rec-retry':{const r=DB.recs.find(x=>x.id===id);if(r)retryPending(r);break}
  case 'rec-tx':{const r=DB.recs.find(x=>x.id===id);if(r)txFile(r);break}
  case 'spk':S.spk=a.dataset.spk||null;render();break;
  case 'seek':{e.preventDefault();const au=$('aud-'+id);if(au&&au.src){au.currentTime=+a.dataset.t;au.play().catch(()=>{})}break}
  case 'rec-sum':summarize(id);break;
  case 'del-rec':if(askConfirm('del-rec'+id)){audioDel(id);DB.recs=DB.recs.filter(r=>r.id!==id);save();toast('Gravação apagada.');render()}break;
  case 'rec-copy':{const r=DB.recs.find(x=>x.id===id);const sel=[...document.querySelectorAll('[data-seg="'+id+'"]:checked')].map(i=>+i.value);const idx=sel.length?sel:r.segs.map((_,i)=>i);const c=caseById(r.caseId);const txt=r.title+' — '+(c?(c.num||c.title)+' — ':'')+fd(parse(r.date))+'\n\n'+idx.map(i=>{const s=r.segs[i];return '['+s[0]+'] '+s[1]+': «'+s[2]+'»'}).join('\n');copyText(txt,sel.length?(sel.length===1?'1 fala copiada.':sel.length+' falas copiadas.'):'Transcrição completa copiada.');break}
 }
});
document.addEventListener('keydown',e=>{
 if(!S.logged&&DB.profile&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName||'')){if(/^[0-9]$/.test(e.key)){pinPress(e.key);return}if(e.key==='Backspace'){pinPress('b');return}}
 if(e.key==='Enter'){const r=e.target.closest&&e.target.closest('tr[data-case]');if(r){S.caseId=r.dataset.case;go('caso')}}
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='q'){S.q=t.value;$('ctable').innerHTML=caseTable();return}
 if(t.dataset.pclient!==undefined){$('newclient').style.display=t.value==='__new'?'grid':'none';return}
 if(t.dataset.xcat!==undefined){const cb=$('x-reemb');if(cb)cb.checked=!!EXP_REEMB[t.value];return}
 if(t.dataset.ncase!==undefined){const el=$('n-exp-list');if(el)el.innerHTML=feeExpHtml(t.value);const c=caseById(t.value);const cs=$('n-client');if(c&&cs)cs.value=c.clientId;return}
 if(t.dataset.tmdesc!==undefined){if(DB.timer){DB.timer.desc=t.value;save()}return}
 if(t.dataset.lvcase!==undefined){S.liveCase=t.value;return}
 if(t.dataset.c!==undefined){const k=t.dataset.c;S.calc[k]=t.type==='checkbox'?t.checked:t.value;
  if(k==='tpl'){const tp=TPL[t.value];S.calc.days=tp.days;S.calc.triggerType=tp.trigger;S.calc.title=tp.name;render();return}
  if(k==='caseId'){const c=caseById(t.value);if(c){S.calc.court=c.court;S.calc.urgent=!!c.urgentLegal}render();return}
  if(k!=='title')renderCalc();return}
 if(t.dataset.df!==undefined){S.doc.f[t.dataset.df]=t.type==='checkbox'?t.checked:t.value;renderDoc();return}
 if(t.dataset.dcase!==undefined){S.doc.caseId=t.value;docPrefill();render();return}
 if(t.dataset.h!==undefined){S.fee[t.dataset.h]=t.type==='checkbox'?t.checked:t.value;renderFee();return}
 if(t.dataset.rqall!==undefined){const v=t.value.toLowerCase();document.querySelectorAll('[data-rc="'+t.dataset.rqall+'"]').forEach(r=>{r.style.display=r.textContent.toLowerCase().includes(v)&&(!S.spk||r.dataset.spk===S.spk)?'':'none'});return}
 if(t.dataset.rq!==undefined){const v=t.value.toLowerCase();document.querySelectorAll('[data-row="'+t.dataset.rq+'"]').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(v)?'':'none');return}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset&&t.dataset.docfile){const fs=[...(t.files||[])];if(fs.length)addDocs(t.dataset.docfile,fs);t.value='';return}
 if(t.dataset&&t.dataset.backup!==undefined){const f=t.files&&t.files[0];t.value='';if(!f)return;f.text().then(x=>{try{const o=JSON.parse(x);if(o.app!=='LEXVORTEX'||!Array.isArray(o.cases))throw 0;S.pendingImport=o;render()}catch(_){toast('Este ficheiro não é uma cópia de segurança da LEXVORTEX.')}});return}
 if(t.dataset&&t.dataset.file){const f=t.files&&t.files[0];if(f)attachFile(t.dataset.file,f);t.value='';return}
 if(t.tagName==='SELECT'||t.type==='checkbox'||t.type==='date')t.dispatchEvent(new Event('input',{bubbles:true}))},true);

document.addEventListener('focusout',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.edit){const r=DB.recs.find(x=>x.id===t.dataset.edit);const i=+t.dataset.i;if(r&&r.segs[i]){const v=t.textContent.trim();if(v&&v!==r.segs[i][2]){r.segs[i][2]=v;save();toast('Correção guardada.')}}}});
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&S.live&&!S.live.stopping){try{S.live.wake=await navigator.wakeLock.request('screen')}catch(_){}try{S.live.ctx.resume()}catch(_){}}});
window.addEventListener('beforeunload',e=>{if(S.live){e.preventDefault();e.returnValue=''}});
try{const th=localStorage.getItem('lv-theme');if(th)document.documentElement.dataset.theme=th}catch(_){}
load();idbOpen();
if(!DB.profile)onboarding();else login();
</script>
</body>
</html>
